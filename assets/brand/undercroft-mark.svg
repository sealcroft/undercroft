<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071016"/>
      <stop offset="1" stop-color="#03080a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ff0cf"/>
      <stop offset="1" stop-color="#0d7f6d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="58%" r="58%">
      <stop offset="0" stop-color="#35e0c2" stop-opacity=".13"/>
      <stop offset="1" stop-color="#35e0c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="290" r="200" fill="url(#halo)"/>

  <!-- the floor of the hall above -->
  <rect x="72" y="152" width="368" height="34" rx="3" fill="#c9a961"/>

  <!-- the substructure, with the chamber cut out of it -->
  <path fill-rule="evenodd" fill="url(#stone)"
        d="M96 186 H416 V424 H96 Z
           M176 424 V318 A80 80 0 0 1 336 318 V424 Z"/>

  <!-- the seal, hanging in the chamber -->
  <circle cx="256" cy="330" r="30" fill="none" stroke="#c9a961" stroke-width="14"/>
</svg>
