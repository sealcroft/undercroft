# The ONE Rust toolchain every build uses (ROADMAP O294): the version the
# Docker images carry (`rust:<version>-slim-bookworm`, named in full in the
# Dockerfile and in CI's lint container), so the binaries `release.yml` ships
# are built by the compiler every suite runs. Before this file each release
# binary was built by its runner image's own stable — 1.97.1 or 1.98.x across
# the v1.* releases, while every suite ran 1.90.0.
#
# rustup obeys this file for every cargo call in the checkout; CI installs it
# through `.github/scripts/pinned-toolchain.sh`, which is also the one reader
# of the version below. The `supply chain is pinned` preflight in
# tests/battery.sh holds the images and every workflow to it, so a bump is one
# change to this file and both image references together.
#
# Exactly these three lines besides comments: a `components` or `targets` line
# would make rustup fetch on a cargo call inside the offline images, and the
# channel is the full version because the images install it under that name
# (`1.90` would send rustup to the network for a toolchain they already hold).
[toolchain]
channel = "1.90.0"
profile = "minimal"
