      <title id="integrity-chain-title">Undercroft integrity chain and the twelve legs of verify</title>
      <desc id="integrity-chain-desc">Every write appends one HMAC-tagged audit record, chained over its label, tag and time, inside the same database transaction that stores the data, advancing the committed head in chain_meta, while a separate manifest anchor is fsynced outside it and deliberately lags behind the database so that a power loss reconciles as a crash rather than raising a tamper alarm; verify then reads that committed state and returns one verdict assembled from twelve legs — storage, SQLite's own integrity check of the file the rows live in, run first, record HMACs, chain replay, the label commitment that binds the labels the chain held when it switched to the labelled step, supersession receipts, knowledge-graph fact receipts, orphan graph labels, mirror drift, which compares a clear column against its HMAC-covered copy, policy drift, which re-verifies every wing-trust and retention row under the current key and matches it to the chain record that assigned it, and version replay, which matches every drawer, fact, entity and tunnel row against the chain record that last wrote it, so an older version of a row written back offline, or a row present after its recorded destruction, is caught as well as an edit or a deletion, and identity and field shapes, which re-derive every fact's id from its decoded words, refuse one id naming rows in two tables and name a covered field of a shape no write produces — the moves a separator-joined version-1 row canonical admits under a tag that still verifies, which no tag check can see.</desc>
