    <h1>How tampering is detected</h1>

      <title id="integrity-chain-title">Undercroft integrity chain and the nine legs of verify</title>
      <desc id="integrity-chain-desc">Every write appends one HMAC-tagged audit record, chained over its label, tag and time, inside the same database transaction that stores the data, advancing the committed head in chain_meta, while a separate manifest anchor is fsynced outside it and deliberately lags behind the database so that a power loss reconciles as a crash rather than raising a tamper alarm; verify then reads that committed state and returns one verdict assembled from nine legs — record HMACs, chain replay, the label commitment that binds the labels the chain held when it switched to the labelled step, supersession receipts, knowledge-graph fact receipts, orphan graph labels, mirror drift, which compares a clear column against its HMAC-covered copy, policy drift, which re-verifies every wing-trust and retention row under the current key and matches it to the chain record that assigned it, and version replay, which matches every drawer, fact, entity and tunnel row against the chain record that last wrote it, so an older version of a row written back offline, or a row present after its recorded destruction, is caught as well as an edit or a deletion.</desc>
