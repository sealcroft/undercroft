<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — How tampering is detected</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;

      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · 12 of 12 · Undercroft</p>
    <h1>How tampering is detected</h1>

    <svg viewBox="0 0 1200 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="integrity-chain-title integrity-chain-desc">
      <title id="integrity-chain-title">Undercroft integrity chain and the six legs of verify</title>
      <desc id="integrity-chain-desc">Every write appends one HMAC-tagged audit record inside the same database transaction that stores the data, advancing the committed head in chain_meta, while a separate manifest anchor is fsynced outside it and deliberately lags behind the database so that a power loss reconciles as a crash rather than raising a tamper alarm; verify then reads that committed state and returns one verdict assembled from six legs — record HMACs, chain replay, supersession receipts, knowledge-graph fact receipts, orphan graph labels, and mirror drift, the leg that compares a clear column against its HMAC-covered copy and so catches an edit made offline.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="120" y="24" width="400" height="560" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="284" y="28" width="72" height="12" rx="2" fill="#04080a"/>
      <text x="320" y="37" fill="rgba(217,240,234,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WRITE PATH</text>

      <rect x="600" y="24" width="480" height="560" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="816" y="28" width="48" height="12" rx="2" fill="#04080a"/>
      <text x="840" y="37" fill="rgba(217,240,234,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VERIFY</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- every write -> chain_append (shared x, straight) -->
      <line x1="320" y1="112" x2="320" y2="160" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- chain_append -> chain_meta (shared x, straight) -->
      <line x1="320" y1="248" x2="320" y2="304" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- chain_meta -> manifest anchor (shared x, straight; outside the transaction) -->
      <line x1="320" y1="392" x2="320" y2="448" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- chain_meta -> verify (gutter corridor at x=548) -->
      <path d="M 480,348 H 540 Q 548,348 548,340 V 100 Q 548,92 556,92 H 632" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- verify -> six legs; attach points 660/692/720/752/780/808 on the bottom edge -->
      <path d="M 808,136 V 164 Q 808,172 816,172 H 848" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 780,136 V 236 Q 780,244 788,244 H 848" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 752,136 V 308 Q 752,316 760,316 H 848" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 720,136 V 380 Q 720,388 728,388 H 848" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 692,136 V 452 Q 692,460 700,460 H 848" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 660,136 V 524 Q 660,532 668,532 H 848" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS (mask + 8px gap) ============ -->
      <rect x="328" y="128" width="96" height="12" rx="2" fill="#04080a"/>
      <text x="376" y="137" fill="#35e0c2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAME TRANSACTION</text>

      <rect x="328" y="268" width="80" height="12" rx="2" fill="#04080a"/>
      <text x="368" y="277" fill="#35e0c2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HEAD ADVANCES</text>

      <rect x="328" y="416" width="84" height="12" rx="2" fill="#04080a"/>
      <text x="370" y="425" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FSYNC + RENAME</text>

      <rect x="556" y="268" width="40" height="12" rx="2" fill="#04080a"/>
      <text x="576" y="277" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>

      <rect x="160" y="48" width="320" height="64" rx="6" fill="#04080a"/>
      <rect x="160" y="48" width="320" height="64" rx="6" fill="rgba(127,163,156,0.10)" stroke="#5c7f79" stroke-width="1"/>

      <text x="188" y="63" fill="rgba(92,127,121,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE</text>
      <text x="320" y="84" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Every write</text>
      <text x="320" y="102" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">drawer · fact · ruling · rotation</text>

      <!-- chain_append (FOCAL) -->
      <rect x="160" y="160" width="320" height="88" rx="6" fill="#04080a"/>
      <rect x="160" y="160" width="320" height="88" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="168" y="166" width="40" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="188" y="175" fill="#35e0c2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHAIN</text>
      <text x="320" y="204" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chain_append</text>
      <text x="320" y="222" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one HMAC-tagged record</text>
      <text x="320" y="236" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">committed with its own data</text>

      <!-- chain_meta -->
      <rect x="160" y="304" width="320" height="88" rx="6" fill="#04080a"/>
      <rect x="160" y="304" width="320" height="88" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="168" y="310" width="36" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="186" y="319" fill="rgba(217,240,234,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HEAD</text>
      <text x="320" y="348" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chain_meta</text>
      <text x="320" y="366" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the committed head</text>
      <text x="320" y="380" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in the db, under HMAC</text>

      <!-- manifest anchor -->
      <rect x="160" y="448" width="320" height="104" rx="6" fill="#04080a"/>
      <rect x="160" y="448" width="320" height="104" rx="6" fill="rgba(217,240,234,0.05)" stroke="#7fa39c" stroke-width="1"/>
      <rect x="168" y="454" width="48" height="12" rx="2" fill="transparent" stroke="rgba(127,163,156,0.40)" stroke-width="0.8"/>
      <text x="192" y="463" fill="rgba(127,163,156,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANCHOR</text>
      <text x="320" y="488" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">manifest anchor</text>
      <text x="320" y="506" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lagging rollback anchor, outside the db</text>
      <text x="320" y="522" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">behind the db: power loss is a crash</text>
      <text x="320" y="538" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ahead of the db: it reads as tamper</text>

      <!-- verify (FOCAL) -->
      <rect x="632" y="48" width="208" height="88" rx="6" fill="#04080a"/>
      <rect x="632" y="48" width="208" height="88" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="640" y="54" width="44" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="662" y="63" fill="#35e0c2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>
      <text x="736" y="92" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">verify</text>
      <text x="736" y="110" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">six legs, one verdict</text>
      <text x="736" y="124" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reads; never writes</text>

      <!-- ============ VERIFY LEGS (chips) ============ -->
      <rect x="848" y="148" width="216" height="48" rx="4" fill="#04080a"/>
      <rect x="848" y="148" width="216" height="48" rx="4" fill="#071014" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="856" y="166" width="24" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>
      <text x="868" y="175" fill="rgba(92,127,121,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="892" y="177" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif">record HMACs</text>

      <rect x="848" y="220" width="216" height="48" rx="4" fill="#04080a"/>
      <rect x="848" y="220" width="216" height="48" rx="4" fill="#071014" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="856" y="238" width="24" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>
      <text x="868" y="247" fill="rgba(92,127,121,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="892" y="249" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif">chain replay</text>

      <rect x="848" y="292" width="216" height="48" rx="4" fill="#04080a"/>
      <rect x="848" y="292" width="216" height="48" rx="4" fill="#071014" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="856" y="310" width="24" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>
      <text x="868" y="319" fill="rgba(92,127,121,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="892" y="321" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif">supersession receipts</text>

      <rect x="848" y="364" width="216" height="48" rx="4" fill="#04080a"/>
      <rect x="848" y="364" width="216" height="48" rx="4" fill="#071014" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="856" y="382" width="24" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>
      <text x="868" y="391" fill="rgba(92,127,121,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="892" y="386" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif">knowledge-graph</text>
      <text x="892" y="400" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif">fact receipts</text>

      <rect x="848" y="436" width="216" height="48" rx="4" fill="#04080a"/>
      <rect x="848" y="436" width="216" height="48" rx="4" fill="#071014" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="856" y="454" width="24" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>
      <text x="868" y="463" fill="rgba(92,127,121,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="892" y="465" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif">orphan graph labels</text>

      <rect x="848" y="508" width="216" height="48" rx="4" fill="#04080a"/>
      <rect x="848" y="508" width="216" height="48" rx="4" fill="rgba(255,93,115,0.10)" stroke="#ff5d73" stroke-width="1"/>

      <text x="892" y="530" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif">mirror drift</text>
      <text x="892" y="544" fill="#ff5d73" font-size="9" font-family="'Geist Mono', monospace">clear column vs covered copy</text>

      <!-- ============ CALLOUT ============ -->
      <line x1="124" y1="604" x2="124" y2="652" stroke="rgba(217,240,234,0.18)" stroke-width="1.2"/>
      <text x="148" y="618" fill="#5c7f79" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE RULE</text>
      <text x="148" y="646" fill="#d9f0ea" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">A keyed claim living in columns no drawer HMAC and no chain step covers must have a leg here, or nothing sees it.</text>

      <line x1="120" y1="696" x2="1080" y2="696" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
