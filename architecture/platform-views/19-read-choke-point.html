  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  <div class="frame">
    <p class="eyebrow">Flowchart · 19 of 22 · Undercroft</p>
    <h1>Every read states what it is, and one site decides whether it is written down</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="read-choke-point-title read-choke-point-desc">
      <title id="read-choke-point-title">Undercroft read choke point</title>
      <desc id="read-choke-point-desc">Every store reader takes a required witness: a read is either Returned with one of thirteen named operations, meaning content goes back to a caller, or Internal with one of eight reasons the engine reads for itself — remote hydration, a write-path lookup, maintenance, verification, the policy fence, an export or refine already recorded as an egress, or membership of a bulk call; only Returned reads reach the single recording site, which appends one read record per call, carrying the operation, a keyed fingerprint of the subject, the scope and the count, and only when read auditing is declared for the deployment. The thirteen operations are counted against the audit rows a driver really wrote, in both directions, and two graph readers through which no content passes are deliberate exclusions rather than omissions.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES (drawn first) ============ -->

      <rect x="876" y="52" width="216" height="12" rx="2" fill="#04080a"/>
      <text x="984" y="61" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">ReadOp::ALL — COUNTED BOTH WAYS</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- door -> witness decision (shared x) -->
      <line x1="232" y1="112" x2="232" y2="148" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- witness: Internal -> no record (shared y) -->
      <line x1="328" y1="180" x2="464" y2="180" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- witness: Returned -> record_read (shared x) -->
      <line x1="232" y1="212" x2="232" y2="272" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- record_read -> declared? (shared x) -->
      <line x1="232" y1="360" x2="232" y2="388" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- declared? NO -> nothing written (shared y) -->
      <line x1="328" y1="420" x2="464" y2="420" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- declared? YES -> read record (shared x) -->
      <line x1="232" y1="452" x2="232" y2="512" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- record_read -> the operations it names (shared y, dashed) -->
      <line x1="368" y1="316" x2="832" y2="316" stroke="#7fa39c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS (mask + gap) ============ -->
      <rect x="368" y="160" width="80" height="12" rx="2" fill="#04080a"/>
      <text x="408" y="169" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">INTERNAL</text>

      <rect x="240" y="232" width="104" height="12" rx="2" fill="#04080a"/>
      <text x="292" y="241" fill="#35e0c2" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">RETURNED(op)</text>

      <rect x="368" y="400" width="32" height="12" rx="2" fill="#04080a"/>
      <text x="384" y="409" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="240" y="472" width="112" height="12" rx="2" fill="#04080a"/>
      <text x="296" y="481" fill="#35e0c2" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES · DECLARED</text>

      <rect x="556" y="296" width="112" height="12" rx="2" fill="#04080a"/>
      <text x="612" y="305" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NAMES THE DOOR</text>

      <rect x="96" y="48" width="272" height="64" rx="20" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>

      <text x="232" y="94" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">get · recent · the graph readers · …</text>

      <text x="232" y="192" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">required, or no compile</text>

      <text x="600" y="184" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">The engine reads for itself</text>
      <text x="600" y="202" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">8 reasons: hydration · write-path lookup · maintenance</text>
      <text x="600" y="216" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">verification · policy fence · bulk member ·</text>

      <!-- record_read (FOCAL) -->
      <rect x="96" y="272" width="272" height="88" rx="6" fill="#04080a"/>
      <rect x="96" y="272" width="272" height="88" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="104" y="278" width="52" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="130" y="287" fill="#35e0c2" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ONE SITE</text>
      <text x="232" y="310" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">record_read</text>
      <text x="232" y="328" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">op · keyed fingerprint of the subject · scope · count</text>
      <text x="232" y="342" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">was three inline copies; the 2nd funnel would have made 11</text>
      <text x="232" y="356" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">never text — an operator with the key can re-derive the fp</text>

      <!-- declared? decision -->
      <polygon points="232,388 328,420 232,452 136,420" fill="#04080a"/>
      <polygon points="232,388 328,420 232,452 136,420" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <text x="232" y="417" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">READ_AUDIT?</text>
      <text x="232" y="432" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">=chain, per deployment</text>

      <!-- nothing written -->
      <rect x="464" y="384" width="272" height="72" rx="6" fill="#04080a"/>
      <rect x="464" y="384" width="272" height="72" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>

      <text x="600" y="430" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">a per-read append is a real durability cost, so declared</text>

      <rect x="104" y="518" width="48" height="12" rx="2" fill="transparent" stroke="rgba(127,163,156,0.40)" stroke-width="0.8"/>
      <text x="128" y="527" fill="rgba(127,163,156,0.90)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ON CHAIN</text>
      <text x="232" y="550" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">read/{op} appended</text>
      <text x="232" y="568" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">one per CALL — a list is one record, never N</text>

      <text x="232" y="596" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">next open, or an explicit `anchor` (a write)</text>
