<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — One Agent Session</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · 09 of 22 · Undercroft</p>
    <h1>One agent session, message by message</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-session-title agent-session-desc">
      <title id="agent-session-title">Undercroft agent session sequence</title>
      <desc id="agent-session-desc">Across one agent session a wake-up call loads recent drawers through the MCP server and the store's read choke point, where the vault verifies each tag and decrypts the content and — only when read auditing is switched on — a read record is written to the audit chain; a search then has the store resolve scope, generate candidates, hydrate and fuse before returning ranked hits with resolved dates, leaving the same kind of read record under the same setting, and a save seals and tags the new drawer in the vault while appending to the audit chain inside the same transaction.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES: lifelines, fragment, activation bars ============ -->
      <!-- lifelines -->
      <line x1="200" y1="112" x2="200" y2="676" stroke="rgba(217,240,234,0.16)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="400" y1="112" x2="400" y2="676" stroke="rgba(217,240,234,0.16)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="112" x2="600" y2="676" stroke="rgba(217,240,234,0.16)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="112" x2="800" y2="676" stroke="rgba(217,240,234,0.16)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1000" y1="112" x2="1000" y2="676" stroke="rgba(217,240,234,0.16)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- opt fragment: read auditing is declared, not default -->
      <rect x="568" y="272" width="464" height="76" rx="4" fill="rgba(217,240,234,0.03)" stroke="rgba(217,240,234,0.20)" stroke-width="1"/>
      <rect x="568" y="272" width="40" height="16" rx="2" fill="#04080a" stroke="rgba(217,240,234,0.20)" stroke-width="1"/>
      <text x="588" y="283" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="580" y="296" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.04em">[UNDERCROFT_READ_AUDIT=chain]</text>

      <!-- activation bars: agent -->
      <rect x="196" y="152" width="8" height="232" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="196" y="412" width="8" height="112" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="196" y="552" width="8" height="112" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <!-- activation bars: mcp server -->
      <rect x="396" y="152" width="8" height="64" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="396" y="412" width="8" height="32" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="396" y="552" width="8" height="32" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <!-- activation bars: store -->
      <rect x="596" y="196" width="8" height="188" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="596" y="428" width="8" height="96" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="596" y="568" width="8" height="96" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <!-- activation bars: vault -->
      <rect x="796" y="240" width="8" height="28" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="796" y="596" width="8" height="28" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <!-- activation bars: audit chain -->
      <rect x="996" y="320" width="8" height="24" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <rect x="996" y="640" width="8" height="28" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>

      <!-- ============ ARROWS (before labels and boxes) ============ -->
      <!-- 1  agent -> mcp : wake up -->
      <line x1="204" y1="160" x2="396" y2="160" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2  mcp -> store : recent(), the read choke point -->
      <line x1="404" y1="204" x2="596" y2="204" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3  store -> vault : verify tag, decrypt -->
      <line x1="604" y1="248" x2="796" y2="248" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4  store -> audit chain : record read (inside the opt fragment) -->
      <line x1="604" y1="328" x2="996" y2="328" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5  store -> agent : return, dashed + filled head -->
      <line x1="596" y1="376" x2="204" y2="376" stroke="#7fa39c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 6  agent -> mcp : search -->
      <line x1="204" y1="420" x2="396" y2="420" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 7  store -> store : the retrieval pipeline -->
      <path d="M 604,452 H 640 Q 648,452 648,460 V 472 Q 648,480 640,480 H 604" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 8  store -> agent : return, dashed + filled head -->
      <line x1="596" y1="516" x2="204" y2="516" stroke="#7fa39c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 9  agent -> mcp : save -->
      <line x1="204" y1="560" x2="396" y2="560" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 10 store -> vault : seal + tag (FOCAL) -->
      <line x1="604" y1="604" x2="796" y2="604" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- 11 store -> audit chain : append, same transaction (FOCAL) -->
      <line x1="604" y1="648" x2="996" y2="648" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ============ ARROW LABELS (mask + 8px gap) ============ -->
      <!-- 1 -->
      <rect x="252" y="140" width="96" height="12" rx="2" fill="#04080a"/>
      <text x="300" y="149" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">undercroft_wake_up</text>

      <!-- 2 -->
      <rect x="444" y="184" width="112" height="12" rx="2" fill="#04080a"/>
      <text x="500" y="193" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">recent(Read::Returned)</text>
      <rect x="420" y="212" width="160" height="12" rx="2" fill="#04080a"/>
      <text x="500" y="221" fill="#d9f0ea" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">READ CHOKE POINT · says so</text>

      <!-- 3 -->
      <rect x="652" y="228" width="100" height="12" rx="2" fill="#04080a"/>
      <text x="702" y="237" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">verify tag · decrypt</text>

      <!-- 4 -->
      <rect x="644" y="308" width="112" height="12" rx="2" fill="#04080a"/>
      <text x="700" y="317" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">record read · keyed fp</text>

      <!-- 5 -->
      <rect x="456" y="356" width="88" height="12" rx="2" fill="#04080a"/>
      <text x="500" y="365" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">drawers, verbatim</text>

      <!-- 6 -->
      <rect x="220" y="388" width="160" height="24" rx="2" fill="#04080a"/>
      <text x="300" y="397" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">undercroft_search</text>
      <text x="300" y="409" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">"when did the migration ship?"</text>

      <!-- 7 -->
      <rect x="656" y="444" width="104" height="44" rx="2" fill="#04080a"/>
      <text x="708" y="456" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">resolve scope</text>
      <text x="708" y="468" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">candidates</text>
      <text x="708" y="480" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">hydrate · fuse</text>

      <!-- 8 -->
      <rect x="444" y="484" width="120" height="24" rx="2" fill="#04080a"/>
      <text x="504" y="493" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">ranked hits +</text>
      <text x="504" y="505" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">resolved time_mentions</text>

      <!-- 9 -->
      <rect x="228" y="528" width="144" height="24" rx="2" fill="#04080a"/>
      <text x="300" y="537" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">undercroft_save</text>
      <text x="300" y="549" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">"decision: ship Thursday"</text>

      <!-- write choke point, annotated on the store lifeline -->
      <rect x="612" y="568" width="152" height="12" rx="2" fill="#04080a"/>
      <text x="688" y="577" fill="#d9f0ea" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">write_drawer(Screen::Apply)</text>

      <!-- 10 -->
      <rect x="664" y="584" width="72" height="12" rx="2" fill="#04080a"/>
      <text x="700" y="593" fill="#35e0c2" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">seal + tag</text>

      <!-- 11 -->
      <rect x="632" y="616" width="144" height="24" rx="2" fill="#04080a"/>
      <text x="704" y="625" fill="#35e0c2" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">append</text>
      <text x="704" y="637" fill="#35e0c2" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.04em">same transaction as the seal</text>

      <!-- ============ NODES (actors) ============ -->
      <!-- Agent -->
      <rect x="120" y="48" width="160" height="64" rx="6" fill="#04080a"/>
      <rect x="120" y="48" width="160" height="64" rx="6" fill="rgba(127,163,156,0.10)" stroke="#5c7f79" stroke-width="1"/>
      <rect x="128" y="54" width="40" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>
      <text x="148" y="63" fill="rgba(92,127,121,0.90)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CALLER</text>
      <text x="200" y="84" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Agent</text>
      <text x="200" y="100" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">holds the session</text>

      <!-- MCP server -->
      <rect x="320" y="48" width="160" height="64" rx="6" fill="#04080a"/>
      <rect x="320" y="48" width="160" height="64" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="328" y="54" width="28" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="342" y="63" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="400" y="84" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">MCP server</text>
      <text x="400" y="100" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">relays every tool call</text>

      <!-- Store (FOCAL) -->
      <rect x="520" y="48" width="160" height="64" rx="6" fill="#04080a"/>
      <rect x="520" y="48" width="160" height="64" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="528" y="54" width="36" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="546" y="63" fill="#35e0c2" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="600" y="84" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Store</text>
      <text x="600" y="100" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">choke points live here</text>

      <!-- Vault -->
      <rect x="720" y="48" width="160" height="64" rx="6" fill="#04080a"/>
      <rect x="720" y="48" width="160" height="64" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="728" y="54" width="36" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="746" y="63" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">VAULT</text>
      <text x="800" y="84" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Vault</text>
      <text x="800" y="100" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">keys · seal · HMAC</text>

      <!-- Audit chain -->
      <rect x="920" y="48" width="160" height="64" rx="6" fill="#04080a"/>
      <rect x="920" y="48" width="160" height="64" rx="6" fill="rgba(217,240,234,0.05)" stroke="#7fa39c" stroke-width="1"/>
      <rect x="928" y="54" width="36" height="12" rx="2" fill="transparent" stroke="rgba(127,163,156,0.40)" stroke-width="0.8"/>
      <text x="946" y="63" fill="rgba(127,163,156,0.90)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CHAIN</text>
      <text x="1000" y="84" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Audit chain</text>
      <text x="1000" y="100" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">append-only, hashed</text>

      <!-- ============ LEGEND ============ -->
      <line x1="120" y1="728" x2="1080" y2="728" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <text x="120" y="748" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="228" y="740" width="16" height="10" rx="2" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1"/>
      <text x="252" y="748" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FOCAL</text>

      <rect x="320" y="740" width="16" height="10" rx="2" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <text x="344" y="748" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ACTOR</text>

      <line x1="412" y1="745" x2="444" y2="745" stroke="#7fa39c" stroke-width="1.2"/>
      <text x="452" y="748" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CALL</text>

      <line x1="508" y1="745" x2="540" y2="745" stroke="#7fa39c" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="548" y="748" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RETURN</text>

      <line x1="616" y1="745" x2="648" y2="745" stroke="#35e0c2" stroke-width="1.2"/>
      <text x="656" y="748" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SEAL + AUDIT</text>

      <rect x="752" y="740" width="8" height="10" fill="rgba(217,240,234,0.06)" stroke="#5c7f79" stroke-width="0.8"/>
      <text x="768" y="748" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ACTIVE</text>

      <rect x="836" y="740" width="16" height="10" rx="2" fill="rgba(217,240,234,0.03)" stroke="rgba(217,240,234,0.20)" stroke-width="1"/>
      <text x="860" y="748" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">OPT FRAGMENT</text>
    </svg>
  </div>
</body>
</html>
