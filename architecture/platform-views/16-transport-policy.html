<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — Transport Policy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · 16 of 22 · Undercroft</p>
    <h1>Five ways out of the process, and the one policy they all pass</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transport-policy-title transport-policy-desc">
      <title id="transport-policy-title">Undercroft outbound transport policy</title>
      <desc id="transport-policy-desc">Every hop that leaves the engine or the orchestrator — the served embedder, the LLM runtime, the five remote vector backends, the orchestrator's calls to an engine, and the OTLP trace exporter — is built by the one transport-policy crate: cleartext is refused anywhere but loopback with no override, a declared CA pin replaces the public roots rather than adding to them, a pin that does not parse refuses to start, and the host a request reaches is always taken from the transport's own URL parser; the postgres hop cannot speak HTTP, so it takes a rustls configuration from the same crate and parses its connection string with the type the connector itself builds.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="80" y="128" width="272" height="344" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="176" y="132" width="80" height="12" rx="2" fill="#04080a"/>
      <text x="216" y="141" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">THIS HOST</text>

      <rect x="832" y="32" width="304" height="504" rx="8" fill="rgba(201,169,97,0.03)" stroke="rgba(201,169,97,0.40)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="912" y="36" width="144" height="12" rx="2" fill="#04080a"/>
      <text x="984" y="45" fill="rgba(201,169,97,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">OTHER TRUST DOMAINS</text>

      <path d="M 336,212 H 384 Q 392,212 392,220 V 264 Q 392,272 400,272 H 448" fill="none" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- orchestrator -> net -->
      <path d="M 336,404 H 384 Q 392,404 392,396 V 320 Q 392,312 400,312 H 448" fill="none" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- net -> served embedder (corridor x=744) -->
      <path d="M 720,244 H 736 Q 744,244 744,236 V 108 Q 744,100 752,100 H 848" fill="none" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- net -> LLM runtime (corridor x=768) -->
      <path d="M 720,268 H 760 Q 768,268 768,260 V 204 Q 768,196 776,196 H 848" fill="none" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- net -> remote index (shared y) -->
      <line x1="720" y1="292" x2="848" y2="292" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- net -> engine /v1, the fleet hop (corridor x=792) -->
      <path d="M 720,316 H 784 Q 792,316 792,324 V 380 Q 792,388 800,388 H 848" fill="none" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- net -> tempo-tls (corridor x=816) -->
      <path d="M 720,340 H 808 Q 816,340 816,348 V 476 Q 816,484 824,484 H 848" fill="none" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <text x="392" y="201" fill="#35e0c2" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ALL OUTBOUND</text>

      <!-- orchestrator -->
      <rect x="96" y="352" width="240" height="104" rx="6" fill="#04080a"/>
      <rect x="96" y="352" width="240" height="104" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="104" y="358" width="44" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="126" y="367" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">BINARY</text>
      <text x="216" y="392" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">undercroft-orchestrator</text>
      <text x="216" y="410" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">engine hop · OTLP hop</text>

      <!-- undercroft-net (FOCAL) -->
      <rect x="448" y="232" width="272" height="120" rx="6" fill="#04080a"/>
      <rect x="448" y="232" width="272" height="120" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="456" y="238" width="44" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="478" y="247" fill="#35e0c2" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">POLICY</text>
      <text x="584" y="272" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">undercroft-net</text>
      <text x="584" y="290" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TLS or loopback — nothing else, no override</text>
      <text x="584" y="304" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">a declared pin REPLACES the public roots</text>
      <text x="584" y="318" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">a pin that does not parse refuses to start</text>
      <text x="584" y="332" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">is_loopback asks the transport's own URL parser</text>

      <!-- served embedder -->
      <rect x="848" y="64" width="272" height="72" rx="6" fill="#04080a"/>

      <text x="984" y="298" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">4 over ureq · pgvector over rustls + postgres::Config</text>
      <text x="984" y="314" fill="#c9a961" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pin: UNDERCROFT_INDEX_CA — one answer on all five</text>

      <text x="984" y="394" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">orchestrator → engine · bearer + minted assertion</text>
      <text x="984" y="410" fill="#c9a961" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pin: UNDERCROFT_ORCH_ENGINE_CA</text>

      <rect x="848" y="448" width="272" height="72" rx="6" fill="rgba(217,240,234,0.03)" stroke="rgba(217,240,234,0.30)" stroke-width="1"/>
      <text x="984" y="472" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OTLP traces (tempo-tls)</text>

      <!-- ============ CALLOUT ============ -->
      <line x1="100" y1="568" x2="100" y2="656" stroke="rgba(217,240,234,0.18)" stroke-width="1.2"/>
      <text x="124" y="582" fill="#5c7f79" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">ASK WHAT A GATE CAN SEE</text>
      <text x="124" y="606" fill="#d9f0ea" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Three gates hold this picture, each on a different observable: one scans source for a second HTTP client's builder,</text>
