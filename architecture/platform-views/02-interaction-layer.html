<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — Interaction Layer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Interaction layer · 02 of 22 · Undercroft</p>
    <h1>The four surfaces, and what each may reach</h1>

    <svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="interaction-layer-title interaction-layer-desc">
      <title id="interaction-layer-title">Undercroft interaction layer</title>
      <desc id="interaction-layer-desc">One Undercroft engine is reached through four surfaces — a command line of 74 operations, 38 MCP agent tools, a 56-route HTTP API, and a multi-tenant control plane that is only ever an HTTP client of that API — and the differences between them are enforced in code rather than documented: parity.rs counts the MCP tool surface against a written inventory in both directions, a READ_TOOLS gate and a quarantine fence decide what MCP may reach, mutates() takes the same read-versus-write decision once in front of HTTP dispatch, and the operator-only capabilities are asserted never to reach MCP at all.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
        <marker id="arrow-accent-back" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#35e0c2"/></marker>
        <marker id="stop-danger" markerWidth="6" markerHeight="12" refX="3" refY="6" orient="auto"><rect x="2" y="0" width="2" height="12" fill="#ff5d73"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="120" y="56" width="960" height="140" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="568" y="60" width="64" height="12" rx="2" fill="#04080a"/>
      <text x="600" y="68" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">SURFACES</text>

      <rect x="120" y="272" width="960" height="140" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="440" y="276" width="128" height="12" rx="2" fill="#04080a"/>
      <text x="504" y="284" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">ENFORCED BOUNDARIES</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- C1  OPERATOR_ONLY -> command line : the operator's own surface reaches them -->
      <path d="M 188,304 V 240 Q 188,232 196,232 H 276 Q 284,232 284,224 V 176" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- C2  OPERATOR_ONLY -x- agent tools : refused, never reaches MCP -->
      <path d="M 244,304 V 276 Q 244,268 252,268 H 372 Q 380,268 380,260 V 184" fill="none" stroke="#ff5d73" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#stop-danger)"/>

      <!-- C3  parity.rs <-> agent tools : counted in both directions -->
      <line x1="408" y1="304" x2="408" y2="176" stroke="#35e0c2" stroke-width="1.4" marker-start="url(#arrow-accent-back)" marker-end="url(#arrow-accent)"/>

      <!-- C4  READ_TOOLS gate -> agent tools -->
      <path d="M 600,304 V 272 Q 600,264 592,264 H 508 Q 500,264 500,256 V 176" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- C5  quarantine fence -> agent tools -->
      <path d="M 792,304 V 244 Q 792,236 784,236 H 564 Q 556,236 556,228 V 176" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- C6  mutates() -> HTTP API -->
      <path d="M 984,304 V 216 Q 984,208 976,208 H 708 Q 700,208 700,200 V 176" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- C7  control plane -> HTTP API (shared y, HTTP link) -->
      <line x1="860" y1="132" x2="804" y2="132" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- ============ ARROW LABELS (mask + 8px gap) ============ -->
      <rect x="212" y="196" width="64" height="12" rx="2" fill="#04080a"/>
      <text x="244" y="204" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REACHABLE</text>

      <rect x="320" y="212" width="52" height="12" rx="2" fill="#04080a"/>
      <text x="346" y="220" fill="#ff5d73" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NEVER</text>

      <rect x="416" y="204" width="64" height="12" rx="2" fill="#04080a"/>
      <text x="448" y="212" fill="#35e0c2" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">BOTH WAYS</text>

      <rect x="508" y="244" width="80" height="12" rx="2" fill="#04080a"/>
      <text x="548" y="252" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">FAILS CLOSED</text>

      <rect x="636" y="216" width="60" height="12" rx="2" fill="#04080a"/>
      <text x="666" y="224" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REFUSES</text>

      <rect x="788" y="188" width="96" height="12" rx="2" fill="#04080a"/>
      <text x="836" y="196" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">BEFORE DISPATCH</text>

      <rect x="808" y="112" width="48" height="12" rx="2" fill="#04080a"/>
      <text x="832" y="120" fill="#c9a961" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">/v1 ONLY</text>

      <!-- ============ NODES ============ -->
      <!-- Command line -->
      <rect x="132" y="88" width="208" height="88" rx="6" fill="#04080a"/>
      <rect x="132" y="88" width="208" height="88" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="140" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="154" y="104" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>

      <text x="236" y="164" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">the operator-driven one</text>

      <!-- Agent tools -->
      <rect x="364" y="88" width="208" height="88" rx="6" fill="#04080a"/>
      <rect x="364" y="88" width="208" height="88" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="372" y="96" width="32" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="388" y="104" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="468" y="132" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Agent tools</text>
      <text x="468" y="148" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">38 tools · 12 writes</text>
      <text x="468" y="164" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">the most fenced one</text>

      <!-- HTTP API -->
      <rect x="596" y="88" width="208" height="88" rx="6" fill="#04080a"/>
      <rect x="596" y="88" width="208" height="88" rx="6" fill="#071014" stroke="#c9a961" stroke-width="1"/>
      <rect x="604" y="96" width="36" height="12" rx="2" fill="transparent" stroke="rgba(201,169,97,0.40)" stroke-width="0.8"/>
      <text x="622" y="104" fill="rgba(201,169,97,0.90)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>
      <text x="700" y="132" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">HTTP API</text>
      <text x="700" y="148" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">56 routes · /v1</text>
      <text x="700" y="164" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">the network surface</text>

      <!-- Control plane -->
      <rect x="860" y="88" width="208" height="88" rx="6" fill="#04080a"/>
      <rect x="860" y="88" width="208" height="88" rx="6" fill="rgba(127,163,156,0.10)" stroke="#5c7f79" stroke-width="1"/>
      <rect x="868" y="96" width="40" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>

      <text x="964" y="132" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Control plane</text>
      <text x="964" y="148" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">multi-tenant proxy</text>
      <text x="964" y="164" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">never linked by the engine</text>

      <!-- OPERATOR_ONLY (FOCAL) -->
      <rect x="128" y="304" width="176" height="104" rx="6" fill="#04080a"/>
      <rect x="128" y="304" width="176" height="104" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="136" y="312" width="52" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="162" y="320" fill="#35e0c2" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">BOUNDARY</text>
      <text x="216" y="348" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OPERATOR_ONLY</text>
      <text x="216" y="364" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">admission · trust · retention · forget</text>
      <text x="216" y="378" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">rotate · anchor · authority · refine</text>
      <text x="216" y="392" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">export · import — ten, counted</text>

      <!-- parity.rs (FOCAL) -->
      <rect x="320" y="304" width="176" height="88" rx="6" fill="#04080a"/>
      <rect x="320" y="304" width="176" height="88" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="328" y="312" width="56" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="356" y="320" fill="#35e0c2" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">INVENTORY</text>
      <text x="408" y="348" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">parity.rs</text>
      <text x="408" y="364" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">the tool surface, written</text>
      <text x="408" y="380" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">a dead line fails the build</text>

      <rect x="512" y="304" width="176" height="88" rx="6" fill="#04080a"/>

      <text x="600" y="348" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">READ_TOOLS gate</text>
