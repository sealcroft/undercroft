  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;

      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }

  <div class="frame">
    <p class="eyebrow">Swimlane · 18 of 22 · Undercroft</p>
    <h1>Three ways content leaves a vault, and the record each one leaves behind</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="egress-paths-title egress-paths-desc">
      <title id="egress-paths-title">Undercroft egress paths and their chain records</title>
      <desc id="egress-paths-desc">Content leaves a vault by three doors, each chain-recorded unconditionally under the egress namespace: an export records before it writes the recipient-sealed or plaintext bundle, because a local write can be re-run; an index push ships sealed content and embeddings to a remote backend in batches of sixty-four and records after the bytes have left, binding the count the backend acknowledged, and a batch that fails part-way records what left before the error propagates; and a refine posts each selected drawer's plaintext to the LLM endpoint and records after the loop, dry run included, with the surface, the destination host, the model, the scope and the counts, and a refine that errors mid-loop records the drawers that left before the error propagates; a run that selected nothing records nothing. A read-only handle serves each and says the egress went unaudited.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
      </defs>
