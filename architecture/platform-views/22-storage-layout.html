<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — Storage Layout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Storage layout · 22 of 22 · Undercroft</p>
    <h1>What is on disk, and which of it is sealed, tagged, or neither</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storage-layout-title storage-layout-desc">
      <title id="storage-layout-title">Undercroft on-disk storage layout</title>
      <desc id="storage-layout-desc">A palace directory holds the master key file, or none when a passphrase is declared, a backups directory of verify-gated copies, and one directory per vault carrying the MAC'd manifest that is the rollback anchor, an optional staged manifest from an unfinished key rotation, and the SQLite database; inside the database eighteen tables and, on an hmac-only vault, one full-text virtual table are grouped by what protects them — the drawer table with sealed content and clear metadata, the sealed derived indexes, the HMAC-tagged operator policy rows, the blinded knowledge graph, the append-only audit chain with its committed head, the navigation tunnels, and the meta table that holds the keycheck marker, the embedder identity and the sealed graph secret.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <text x="168" y="53" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">PALACE · ~/.undercroft</text>
      <!-- one vault -->
      <rect x="352" y="72" width="760" height="624" rx="8" fill="rgba(53,224,194,0.04)" stroke="rgba(53,224,194,0.30)" stroke-width="0.8"/>
      <rect x="368" y="76" width="104" height="12" rx="2" fill="#04080a"/>
      <text x="420" y="85" fill="rgba(53,224,194,0.70)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">vaults/&lt;id&gt;/</text>
      <!-- the tables -->
      <rect x="384" y="224" width="704" height="448" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="656" y="228" width="160" height="12" rx="2" fill="#04080a"/>
      <text x="736" y="237" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">palace.db · 18 TABLES + 1 VIRTUAL</text>

      <text x="752" y="136" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">vault.json.next</text>

      <rect x="896" y="112" width="192" height="80" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
