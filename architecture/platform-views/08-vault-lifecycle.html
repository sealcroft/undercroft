<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — Vault Lifecycle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · 08 of 12 · Undercroft</p>
    <h1>A vault through its life</h1>

    <svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vault-lifecycle-title vault-lifecycle-desc">
      <title id="vault-lifecycle-title">Undercroft vault lifecycle</title>
      <desc id="vault-lifecycle-desc">A vault starts uninitialised, becomes sealed at rest once initialised, and from there opens either writable or read-only; every open reconciles the manifest anchor, where a crash fast-forwards it and a rollback is reported as tamper. A writable vault can rotate its keys or repair itself — each a single transaction that returns it to writable — and can be archived into a signed backup bundle, while the read-only role creates nothing, migrates nothing and promotes no staging manifest.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="584" y="32" width="552" height="152" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="824" y="36" width="72" height="12" rx="2" fill="#04080a"/>
      <text x="860" y="45" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">IN-FLIGHT</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- start dot -> Uninitialised (shared y) -->
      <line x1="76" y1="332" x2="104" y2="332" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Uninitialised -> Sealed at rest (shared y) -->
      <line x1="256" y1="332" x2="352" y2="332" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Sealed at rest -> Open, writable (shared y) -->
      <line x1="552" y1="332" x2="664" y2="332" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Sealed at rest -> Open, read-only (shared x) -->
      <line x1="452" y1="376" x2="452" y2="528" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Open, writable -> Rotating (shared x) -->
      <line x1="688" y1="288" x2="688" y2="152" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rotating -> Open, writable (shared x) -->
      <line x1="736" y1="152" x2="736" y2="288" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Open, writable -> Repairing -->
      <path d="M 816,288 V 224 Q 816,216 824,216 H 948 Q 956,216 956,208 V 152" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Repairing -> Open, writable -->
      <path d="M 1052,152 V 240 Q 1052,248 1044,248 H 880 Q 872,248 872,256 V 288" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Open, writable -> Archived -->
      <path d="M 904,332 H 976 Q 984,332 984,340 V 524" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Open, writable -> itself: reconcile anchor -->
      <path d="M 712,376 V 424 Q 712,432 704,432 H 632 Q 624,432 624,424 V 368 Q 624,360 632,360 H 664" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS (mask + 8px gap) ============ -->
      <rect x="280" y="312" width="48" height="12" rx="2" fill="#04080a"/>
      <text x="304" y="321" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">init</text>

      <rect x="572" y="312" width="72" height="12" rx="2" fill="#04080a"/>
      <text x="608" y="321" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">open rw</text>

      <rect x="372" y="444" width="72" height="12" rx="2" fill="#04080a"/>
      <text x="408" y="453" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">open ro</text>

      <rect x="624" y="212" width="56" height="12" rx="2" fill="#04080a"/>
      <text x="652" y="221" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">rotate</text>

      <rect x="744" y="212" width="48" height="12" rx="2" fill="#04080a"/>
      <text x="768" y="221" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">commit</text>

      <rect x="852" y="196" width="56" height="12" rx="2" fill="#04080a"/>
      <text x="880" y="205" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">repair</text>

      <rect x="988" y="256" width="56" height="12" rx="2" fill="#04080a"/>
      <text x="1016" y="265" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">healed</text>

      <rect x="992" y="424" width="88" height="12" rx="2" fill="#04080a"/>
      <text x="1036" y="433" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">backup create</text>

      <rect x="556" y="440" width="224" height="28" rx="2" fill="#04080a"/>
      <text x="668" y="452" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">reconcile anchor</text>
      <text x="668" y="465" fill="#5c7f79" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">crash &#8594; fast-forward · rollback &#8594; <tspan fill="#ff5d73">TAMPER</tspan></text>

      <!-- ============ NODES ============ -->
      <!-- start dot -->
      <circle cx="64" cy="332" r="6" fill="#d9f0ea"/>

      <!-- Note -->
      <rect x="64" y="64" width="424" height="88" rx="6" fill="#04080a"/>
      <rect x="64" y="64" width="424" height="88" rx="6" fill="rgba(127,163,156,0.10)" stroke="#5c7f79" stroke-width="1" stroke-dasharray="4 4"/>
      <rect x="72" y="70" width="32" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>
      <text x="88" y="79" fill="rgba(92,127,121,0.90)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">NOTE</text>
      <text x="276" y="108" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">A crash mid-rotation still opens</text>
      <text x="276" y="126" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">reconcile fast-forwards the anchor</text>
      <text x="276" y="140" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">so the read-only role REPORTS, never heals</text>

      <!-- Rotating (FOCAL) -->
      <rect x="616" y="64" width="224" height="88" rx="6" fill="#04080a"/>
      <rect x="616" y="64" width="224" height="88" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="624" y="70" width="28" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="638" y="79" fill="#35e0c2" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TXN</text>
      <text x="728" y="108" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Rotating</text>
      <text x="728" y="126" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">one transaction · re-seals all</text>
      <text x="728" y="140" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">re-keys chain over PRESERVED bytes</text>

      <!-- Repairing -->
      <rect x="904" y="64" width="200" height="88" rx="6" fill="#04080a"/>
      <rect x="904" y="64" width="200" height="88" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="912" y="70" width="28" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="926" y="79" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TXN</text>
      <text x="1004" y="108" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Repairing</text>
      <text x="1004" y="126" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">rebuild index · heal anchor</text>
      <text x="1004" y="140" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">content never rewritten</text>

      <!-- Uninitialised -->
      <rect x="104" y="288" width="152" height="88" rx="6" fill="#04080a"/>
      <rect x="104" y="288" width="152" height="88" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="112" y="294" width="36" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="130" y="303" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
      <text x="180" y="332" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Uninitialised</text>
      <text x="180" y="350" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">no vault.json</text>
      <text x="180" y="364" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">no palace.db</text>

      <!-- Sealed at rest -->
      <rect x="352" y="288" width="200" height="88" rx="6" fill="#04080a"/>
      <rect x="352" y="288" width="200" height="88" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="360" y="294" width="48" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="384" y="303" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">AT REST</text>
      <text x="452" y="332" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Sealed at rest</text>
      <text x="452" y="350" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">keys derived · nothing open</text>
      <text x="452" y="364" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">manifest is the anchor</text>

      <!-- Open, writable (FOCAL) -->
      <rect x="664" y="288" width="240" height="88" rx="6" fill="#04080a"/>
      <rect x="664" y="288" width="240" height="88" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="672" y="294" width="24" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="684" y="303" fill="#35e0c2" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RW</text>
      <text x="784" y="332" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Open, writable</text>
      <text x="784" y="350" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">every write: HMAC + chain step</text>
      <text x="784" y="364" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">screen · audit · anchor</text>

      <!-- Open, read-only -->
      <rect x="352" y="528" width="232" height="88" rx="6" fill="#04080a"/>
      <rect x="352" y="528" width="232" height="88" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="360" y="534" width="24" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="372" y="543" fill="rgba(217,240,234,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RO</text>
      <text x="468" y="572" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Open, read-only</text>
      <text x="468" y="590" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">creates nothing · migrates nothing</text>
      <text x="468" y="604" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">promotes no staging manifest</text>

      <!-- Archived (terminal: ringed) -->
      <rect x="900" y="524" width="208" height="96" rx="10" fill="none" stroke="rgba(127,163,156,0.35)" stroke-width="0.8"/>
      <rect x="904" y="528" width="200" height="88" rx="6" fill="#04080a"/>
      <rect x="904" y="528" width="200" height="88" rx="6" fill="rgba(217,240,234,0.05)" stroke="#7fa39c" stroke-width="1"/>
      <rect x="912" y="534" width="44" height="12" rx="2" fill="transparent" stroke="rgba(127,163,156,0.40)" stroke-width="0.8"/>
      <text x="934" y="543" fill="rgba(127,163,156,0.90)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">BUNDLE</text>
      <text x="1004" y="572" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Archived</text>
      <text x="1004" y="590" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">verify-gated snapshot</text>
      <text x="1004" y="604" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">signed · recipient-sealed</text>

      <!-- ============ LEGEND ============ -->
      <line x1="64" y1="664" x2="1136" y2="664" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <text x="64" y="684" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="168" y="676" width="16" height="8" rx="2" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1"/>
      <text x="192" y="684" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FOCAL</text>

      <rect x="272" y="676" width="16" height="8" rx="2" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <text x="296" y="684" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STATE</text>

      <rect x="376" y="676" width="16" height="8" rx="2" fill="rgba(217,240,234,0.05)" stroke="#7fa39c" stroke-width="1"/>
      <text x="400" y="684" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TERMINAL</text>

      <rect x="512" y="676" width="16" height="8" rx="2" fill="rgba(127,163,156,0.10)" stroke="#5c7f79" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="536" y="684" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NOTE</text>

      <line x1="616" y1="680" x2="648" y2="680" stroke="#7fa39c" stroke-width="1.2"/>
      <text x="656" y="684" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TRANSITION</text>

      <rect x="776" y="676" width="16" height="8" rx="2" fill="rgba(255,93,115,0.12)" stroke="#ff5d73" stroke-width="1"/>
      <text x="800" y="684" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TAMPER VERDICT</text>
    </svg>
  </div>
</body>
</html>
