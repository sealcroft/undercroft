  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>

    <h1>How a change proves itself, from the battery to the tag</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="verification-pipeline-title verification-pipeline-desc">
      <title id="verification-pipeline-title">Undercroft verification pipeline</title>
      <desc id="verification-pipeline-desc">A change runs the host-side battery first — fourteen preflights over the whole tree with git, awk and grep, then ten Docker suites always rebuilt, where exit codes are the verdict and every measured check count is compared to the figure the guide publishes — updates the house page before the push when a published figure moved, then opens a pull request that eleven CI jobs examine, including a Windows compile, a matrix of eight suites, a host-side TLS-pin job and the one job that needs the internet; a single verdict job that needs every other job and counts them is the only required status check, and only after merge does an explicit tag fire the release workflow, which builds five targets in two variants, publishes two multi-arch images and smoke-probes each asset from its packaged layout before the pages and the house page are verified live.</desc>

      <text x="856" y="53" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">ON GITHUB</text>

      <text x="92" y="598" fill="#d9f0ea" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif">The battery never parses suite output to decide pass or fail, never pipes a suite, and runs every suite in one pass over one tree —</text>
