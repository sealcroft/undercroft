<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — Deployment</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · 10 of 12 · Undercroft</p>
    <h1>Where it runs</h1>

    <svg viewBox="0 0 1200 812" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-title deployment-desc">
      <title id="deployment-title">Undercroft deployment shapes</title>
      <desc id="deployment-desc">Undercroft is deployed in three shapes: one user runs the binary locally, where the command line and a stdio MCP server open no port and mount a vault directory holding palace.db and its manifest; one served host runs serve-http, which puts /v1, /mcp and /metrics behind a bearer token that is mandatory for any non-loopback bind, serves /ui in front of that gate as a static shell carrying no secrets that the operator pastes the bearer into, and keeps the vault on that host; and a fleet adds the orchestrator, which holds the tenant registry and sealed engine credentials in its own SQLite, proxies tenant traffic to engines over /v1, and is trailed by a read replica whose state database is read-only and whose lag is reported by /healthz.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="120" y="152" width="464" height="324" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="136" y="156" width="76" height="12" rx="2" fill="#04080a"/>
      <text x="144" y="165" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">SINGLE USER</text>

      <rect x="616" y="152" width="464" height="324" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="632" y="156" width="100" height="12" rx="2" fill="#04080a"/>
      <text x="640" y="165" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">ONE HOST, SERVED</text>

      <rect x="120" y="508" width="960" height="208" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="136" y="512" width="48" height="12" rx="2" fill="#04080a"/>
      <text x="144" y="521" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">FLEET</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- caller -> the local binary: a spawn, not a network hop -->
      <path d="M 560,104 V 124 Q 560,132 552,132 H 360 Q 352,132 352,140 V 192" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- caller -> serve-http (HTTP, gold link) -->
      <path d="M 640,104 V 124 Q 640,132 648,132 H 840 Q 848,132 848,140 V 192" fill="none" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- binary -> vault directory (shared x, straight) -->
      <line x1="352" y1="324" x2="352" y2="364" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- orchestrator -> engine (shared x, straight; /v1 only) -->
      <line x1="848" y1="548" x2="848" y2="408" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- writer -> read replica (shared y, replication) -->
      <line x1="648" y1="600" x2="552" y2="600" stroke="#7fa39c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS (mask + 8px gap) ============ -->
      <rect x="420" y="112" width="80" height="12" rx="2" fill="#04080a"/>
      <text x="460" y="121" fill="#7fa39c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">EXEC · STDIO</text>

      <rect x="720" y="112" width="48" height="12" rx="2" fill="#04080a"/>

      <text x="176" y="272" fill="#d9f0ea" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">CLI</text>
      <text x="528" y="272" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">74 operations</text>
      <rect x="164" y="288" width="376" height="24" rx="4" fill="rgba(217,240,234,0.05)" stroke="rgba(127,163,156,0.35)" stroke-width="0.8"/>
      <text x="176" y="304" fill="#d9f0ea" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">serve-mcp</text>
      <text x="528" y="304" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">stdio, no port</text>

      <!-- vault directory on disk -->
      <rect x="152" y="364" width="400" height="80" rx="6" fill="#04080a"/>
      <rect x="152" y="364" width="400" height="80" rx="6" fill="rgba(217,240,234,0.05)" stroke="#7fa39c" stroke-width="1"/>
      <rect x="160" y="370" width="36" height="12" rx="2" fill="transparent" stroke="rgba(127,163,156,0.40)" stroke-width="0.8"/>
      <text x="178" y="379" fill="rgba(127,163,156,0.90)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
      <text x="352" y="398" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">~/.undercroft</text>
      <text x="352" y="416" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">palace.db · vault.json</text>

      <!-- serve-http (FOCAL) -->
      <rect x="648" y="192" width="400" height="216" rx="6" fill="#04080a"/>

      <text x="1024" y="384" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">telemetry build</text>
      <text x="648" y="440" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the vault stays on this host</text>

      <!-- read replica -->
      <rect x="152" y="548" width="400" height="104" rx="6" fill="#04080a"/>
      <rect x="152" y="548" width="400" height="104" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
