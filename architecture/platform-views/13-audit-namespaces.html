    <h1>What the audit chain is allowed to say, and to whom</h1>

      <title id="audit-namespaces-title">Undercroft audit-chain namespaces and the agent fence</title>
      <desc id="audit-namespaces-desc">Every audit record id is a namespace prefix plus the caller's subject, and the namespace is a Rust type with thirteen variants: chain_append requires one, so twelve of the thirteen are minted through that single door while key rotation writes its rotate record with its own insert because it computes the chain head over preserved bytes; the chain hashes each record's tag and never its id; and the MCP history tool, reading at agent scope, is fenced from nine of the thirteen — admission rulings, trust, retention and its clearing, deletions, egresses, the read trail, rotations and migrations — and sees only drawer, knowledge-graph, entity and tunnel records.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
      </defs>
