<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — Admission Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · 07 of 12 · Undercroft</p>
    <h1>Admission control: what happens to a suspicious write</h1>

    <svg viewBox="0 0 1200 992" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="admission-control-title admission-control-desc">
      <title id="admission-control-title">Undercroft admission control</title>
      <desc id="admission-control-desc">An incoming write is refused with a 400 when its declaration is invalid, committed verbatim when the admission screen is off or its tier-1 detector trips no signals, and otherwise diverted into the quarantine-pending wing with a 202 naming the id it landed under, where it is excluded from search, recent and list_drawers until an operator — never an agent over MCP — allows or denies it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
        <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff5d73"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="664" y="616" width="416" height="276" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="816" y="620" width="112" height="12" rx="2" fill="#04080a"/>
      <text x="872" y="629" fill="rgba(217,240,234,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AFTER DIVERSION</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- start -> declaration decision (shared x) -->
      <line x1="480" y1="104" x2="480" y2="136" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- declaration NO -> refused 400 (shared y, danger) -->
      <line x1="352" y1="192" x2="296" y2="192" stroke="#ff5d73" stroke-width="1.2" marker-end="url(#arrow-danger)"/>
      <!-- declaration YES -> screen decision (shared x) -->
      <line x1="480" y1="248" x2="480" y2="304" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- screen NO -> write committed -->
      <path d="M 592,360 H 864 Q 872,360 872,368 V 412" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- screen YES -> tier-1 decision (shared x) -->
      <line x1="480" y1="416" x2="480" y2="472" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- signals NO -> write committed -->
      <path d="M 656,536 H 880 Q 888,536 888,528 V 484" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- signals YES -> quarantine (shared x, danger) -->
      <line x1="480" y1="600" x2="480" y2="656" stroke="#ff5d73" stroke-width="1.2" marker-end="url(#arrow-danger)"/>
      <!-- quarantine -> fence (shared y) -->
      <line x1="600" y1="700" x2="696" y2="700" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- fence -> operator ruling (shared x) -->
      <line x1="872" y1="736" x2="872" y2="776" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS (mask + 8-10px gap) ============ -->
      <rect x="308" y="170" width="28" height="12" rx="2" fill="#04080a"/>
      <text x="322" y="179" fill="#ff5d73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="488" y="264" width="32" height="12" rx="2" fill="#04080a"/>
      <text x="504" y="273" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="604" y="338" width="28" height="12" rx="2" fill="#04080a"/>
      <text x="618" y="347" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="488" y="432" width="32" height="12" rx="2" fill="#04080a"/>
      <text x="504" y="441" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="668" y="514" width="28" height="12" rx="2" fill="#04080a"/>
      <text x="682" y="523" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="488" y="616" width="32" height="12" rx="2" fill="#04080a"/>
      <text x="504" y="625" fill="#ff5d73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="608" y="678" width="48" height="12" rx="2" fill="#04080a"/>
      <text x="632" y="687" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THE ROW</text>

      <rect x="880" y="744" width="64" height="12" rx="2" fill="#04080a"/>
      <text x="912" y="753" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>

      <!-- ============ NODES ============ -->
      <!-- START -->
      <rect x="380" y="48" width="200" height="56" rx="20" fill="#04080a"/>
      <rect x="380" y="48" width="200" height="56" rx="20" fill="rgba(127,163,156,0.10)" stroke="#5c7f79" stroke-width="1"/>
      <rect x="396" y="54" width="36" height="12" rx="2" fill="transparent" stroke="rgba(92,127,121,0.40)" stroke-width="0.8"/>
      <text x="414" y="63" fill="rgba(92,127,121,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
      <text x="480" y="88" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write arrives</text>

      <!-- Decision 1: declaration valid? -->
      <polygon points="480,136 608,192 480,248 352,192" fill="#04080a"/>
      <polygon points="480,136 608,192 480,248 352,192" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <text x="480" y="168" fill="rgba(217,240,234,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DECISION</text>
      <text x="480" y="192" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Declaration valid?</text>
      <text x="480" y="210" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checked before the screen</text>

      <!-- Refused 400 (danger terminal) -->
      <rect x="120" y="156" width="176" height="72" rx="20" fill="#04080a"/>
      <rect x="120" y="156" width="176" height="72" rx="20" fill="rgba(255,93,115,0.10)" stroke="#ff5d73" stroke-width="1"/>
      <rect x="136" y="162" width="48" height="12" rx="2" fill="transparent" stroke="rgba(255,93,115,0.40)" stroke-width="0.8"/>
      <text x="160" y="171" fill="rgba(255,93,115,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REFUSED</text>
      <text x="208" y="194" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refused · 400</text>
      <text x="208" y="212" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nothing is written</text>

      <!-- Decision 2: screen enabled? -->
      <polygon points="480,304 592,360 480,416 368,360" fill="#04080a"/>
      <polygon points="480,304 592,360 480,416 368,360" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <text x="480" y="336" fill="rgba(217,240,234,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DECISION</text>
      <text x="480" y="360" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Screen enabled?</text>
      <text x="480" y="378" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UNDERCROFT_ADMISSION</text>

      <!-- Decision 3: tier-1 detector -->
      <polygon points="480,472 656,536 480,600 304,536" fill="#04080a"/>
      <polygon points="480,472 656,536 480,600 304,536" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <text x="480" y="504" fill="rgba(217,240,234,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DECISION</text>
      <text x="480" y="528" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tier-1 detector: signals tripped?</text>
      <text x="480" y="546" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic · closed vocabulary</text>
      <text x="480" y="560" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">offsets, never content</text>

      <!-- Write committed (FOCAL) -->
      <rect x="760" y="412" width="240" height="72" rx="20" fill="#04080a"/>
      <rect x="760" y="412" width="240" height="72" rx="20" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="776" y="418" width="60" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="806" y="427" fill="#35e0c2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMMITTED</text>
      <text x="880" y="450" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write committed</text>
      <text x="880" y="468" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verbatim · sealed · audit chain</text>

      <!-- Quarantine divert (danger) -->
      <rect x="360" y="656" width="240" height="88" rx="6" fill="#04080a"/>
      <rect x="360" y="656" width="240" height="88" rx="6" fill="rgba(255,93,115,0.10)" stroke="#ff5d73" stroke-width="1"/>
      <rect x="368" y="662" width="44" height="12" rx="2" fill="transparent" stroke="rgba(255,93,115,0.40)" stroke-width="0.8"/>
      <text x="390" y="671" fill="rgba(255,93,115,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIVERT</text>
      <text x="480" y="700" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quarantine-pending wing</text>
      <text x="480" y="718" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">202 quarantined, not 200</text>
      <text x="480" y="732" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">with the id it landed under</text>

      <!-- Fence: what a diverted drawer is excluded from -->
      <rect x="696" y="656" width="352" height="80" rx="6" fill="#04080a"/>
      <rect x="696" y="656" width="352" height="80" rx="6" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <rect x="704" y="662" width="36" height="12" rx="2" fill="transparent" stroke="rgba(217,240,234,0.40)" stroke-width="0.8"/>
      <text x="722" y="671" fill="rgba(217,240,234,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FENCE</text>
      <text x="872" y="696" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Excluded from every read that returns content</text>
      <text x="872" y="714" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">search · recent · list_drawers</text>
      <text x="872" y="728" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raised by the ROWS, not by the setting</text>

      <!-- Operator ruling (FOCAL) -->
      <rect x="696" y="776" width="352" height="80" rx="6" fill="#04080a"/>
      <rect x="696" y="776" width="352" height="80" rx="6" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1.2"/>
      <rect x="704" y="782" width="56" height="12" rx="2" fill="transparent" stroke="rgba(53,224,194,0.50)" stroke-width="0.8"/>
      <text x="732" y="791" fill="#35e0c2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPERATOR</text>
      <text x="872" y="816" fill="#d9f0ea" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ruling: allow or deny</text>
      <text x="872" y="834" fill="#7fa39c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">operator surfaces only, never MCP</text>
      <text x="872" y="848" fill="#5c7f79" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deny is receipted, allow restores</text>

      <!-- ============ LEGEND ============ -->
      <line x1="120" y1="924" x2="1080" y2="924" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <text x="120" y="944" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="228" y="936" width="16" height="12" rx="6" fill="rgba(127,163,156,0.10)" stroke="#5c7f79" stroke-width="1"/>
      <text x="252" y="944" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace">TERMINAL</text>

      <rect x="316" y="936" width="16" height="12" rx="2" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <text x="340" y="944" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace">STEP</text>

      <polygon points="396,936 408,942 396,948 384,942" fill="#071014" stroke="#d9f0ea" stroke-width="1"/>
      <text x="412" y="944" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>

      <rect x="476" y="936" width="16" height="12" rx="2" fill="rgba(255,93,115,0.10)" stroke="#ff5d73" stroke-width="1"/>
      <text x="500" y="944" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace">REFUSED / DIVERTED</text>

      <rect x="612" y="936" width="16" height="12" rx="2" fill="rgba(53,224,194,0.10)" stroke="#35e0c2" stroke-width="1"/>
      <text x="636" y="944" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace">FOCAL</text>

      <line x1="688" y1="942" x2="720" y2="942" stroke="#7fa39c" stroke-width="1.2"/>
      <text x="728" y="944" fill="#7fa39c" font-size="8" font-family="'Geist Mono', monospace">FLOW</text>
    </svg>
  </div>
</body>
</html>
