<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercroft — Platform Overview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #04080a;
      --color-raise:  #071014;
      --color-ink:    #d9f0ea;
      --color-muted:  #7fa39c;
      --color-accent: #35e0c2;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · 01 of 12 · Undercroft</p>
    <h1>The platform, end to end</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platform-overview-title platform-overview-desc">
      <title id="platform-overview-title">Undercroft platform overview</title>
      <desc id="platform-overview-desc">An agent reaches Undercroft through three surfaces — command line, MCP and a REST API — which all enter one store; the store uses the core domain library and the vault crypto layer, and the vault writes sealed bytes to a SQLite database alongside a manifest anchor held outside it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa39c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#35e0c2"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a961"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#04080a"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="120" y="152" width="960" height="136" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="560" y="156" width="80" height="12" rx="2" fill="#04080a"/>
      <text x="600" y="165" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">SURFACES</text>

      <rect x="120" y="352" width="960" height="152" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="568" y="356" width="64" height="12" rx="2" fill="#04080a"/>
      <text x="600" y="365" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">ENGINE</text>

      <rect x="120" y="568" width="960" height="136" rx="8" fill="rgba(217,240,234,0.02)" stroke="rgba(217,240,234,0.10)" stroke-width="0.8"/>
      <rect x="564" y="572" width="72" height="12" rx="2" fill="#04080a"/>
      <text x="600" y="581" fill="rgba(217,240,234,0.40)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">AT REST</text>

      <!-- agent -> MCP (shared x, straight) -->
      <line x1="600" y1="104" x2="600" y2="184" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- agent -> /v1 (HTTP, gold link) -->
      <path d="M 640,104 V 136 Q 640,144 648,144 H 932 Q 940,144 940,152 V 184" fill="none" stroke="#c9a961" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- CLI -> store -->

      <!-- MCP -> store (shared x, straight) -->
      <line x1="600" y1="256" x2="600" y2="384" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 940,256 V 312 Q 940,320 932,320 H 658 Q 650,320 650,328 V 384" fill="none" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="500" y1="428" x2="368" y2="428" stroke="#7fa39c" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="700" y1="428" x2="832" y2="428" stroke="#35e0c2" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <rect x="500" y="184" width="200" height="72" rx="6" fill="#04080a"/>

      <text x="600" y="222" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Agent tools</text>
      <text x="600" y="240" fill="#7fa39c" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">38 tools · 13 write</text>

      <!-- /v1 -->
      <rect x="840" y="184" width="200" height="72" rx="6" fill="#04080a"/>

      <rect x="160" y="384" width="200" height="88" rx="6" fill="#04080a"/>

      <text x="260" y="428" fill="#d9f0ea" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Domain library</text>

      <text x="600" y="460" fill="#5c7f79" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">every write passes here</text>
