<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 826" width="900" height="826" role="img" aria-labelledby="t d">
<title id="t">The two security levels and what each protects</title>
<desc id="d">A vault is created Sealed or HmacOnly. Sealed encrypts content, embeddings, token matrices and index artifacts and has no full-text index; HmacOnly keeps content in plaintext and indexes it. Both carry a per-row HMAC and join the audit chain. Drawer metadata is unsealed at both levels, and the exposed fields are listed.</desc>
<style>
  .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .h { font-size: 17px; font-weight: 600; }
  .l { font-size: 13.5px; font-weight: 600; }
  .b { font-size: 12px; }
  .s { font-size: 11px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
  .ink { fill: var(--d-ink,#14202b); }
  .dim { fill: var(--d-dim,#55697a); }
  .white { fill: var(--d-card,#ffffff); }
  @media (prefers-color-scheme: dark) {
    svg { --d-bg:#0f1419; --d-card:#161c23; --d-card2:#1b222b; --d-line:#2b3540;
      --d-line2:#4a5b6b; --d-ink:#e4ebf1; --d-dim:#9aabba; --d-on:#0f1419;
      --d-teal:#2ba99c; --d-teal-bg:#0e2523; --d-teal-bg2:#123430; --d-teal-ink:#6fd8cc;
      --d-blue:#6d94c8; --d-blue-bg:#131d2b; --d-blue-ink:#9dbde3;
      --d-amber:#d1953f; --d-amber-bg:#261c0f; --d-amber-ink:#e8bc78;
      --d-violet:#9277c9; --d-violet-bg:#1c1730; --d-violet-bg2:#241d3d; --d-violet-ink:#b9a3e3;
      --d-green:#4fa570; --d-green-bg:#10231a; --d-green-bg2:#153021; --d-green-ink:#86cf9f;
      --d-red:#d1685c; --d-red-bg:#2a1614; --d-red-ink:#eb9a90; }
  }
</style>
<rect width="900" height="826" fill="var(--d-bg,#fbfcfd)"/>

<text x="28" y="38" class="f h ink">Two levels, and what each one actually protects</text>
<text x="28" y="58" class="f b dim">Chosen per vault at creation. The difference is confidentiality alone — integrity is not a tier and has no off switch at either level.</text>

<rect x="24" y="76" width="852" height="330" rx="10" fill="var(--d-card,#ffffff)" stroke="var(--d-line,#c9d4dd)" stroke-width="1.5"/>
<text x="42" y="102" class="f l ink">What is written to disk</text>
<rect x="470" y="112" width="196" height="26" rx="6" fill="var(--d-teal-bg,#f2fbfa)" stroke="var(--d-teal,#12897e)" stroke-width="1.4"/>
<text x="568" y="130" class="f l" fill="var(--d-teal-ink,#0d6b62)" text-anchor="middle">Sealed — the default</text>
<rect x="678" y="112" width="180" height="26" rx="6" fill="var(--d-amber-bg,#fdf6ee)" stroke="var(--d-amber,#b5762a)" stroke-width="1.4"/>
<text x="768" y="130" class="f l" fill="var(--d-amber-ink,#8d5a1d)" text-anchor="middle">HmacOnly</text>

<line x1="42" y1="148" x2="858" y2="148" stroke="var(--d-line,#c9d4dd)" stroke-width="1"/>
<text x="42" y="170" class="f b ink">drawer content</text>
<text x="568" y="170" class="f s" fill="var(--d-teal-ink,#0d6b62)" text-anchor="middle">zstd, then encrypted</text>
<text x="768" y="170" class="f s" fill="var(--d-amber-ink,#8d5a1d)" text-anchor="middle">plaintext</text>

<text x="42" y="196" class="f b ink">embedding</text>
<text x="42" y="211" class="f s dim">i8-quantized first — a vector of the text leaks the text</text>
<text x="568" y="196" class="f s" fill="var(--d-teal-ink,#0d6b62)" text-anchor="middle">encrypted</text>
<text x="768" y="196" class="f s" fill="var(--d-amber-ink,#8d5a1d)" text-anchor="middle">in clear</text>

<text x="42" y="238" class="f b ink">ColBERT token matrices</text>
<text x="568" y="238" class="f s" fill="var(--d-teal-ink,#0d6b62)" text-anchor="middle">encrypted</text>
<text x="768" y="238" class="f s" fill="var(--d-amber-ink,#8d5a1d)" text-anchor="middle">in clear</text>

<text x="42" y="264" class="f b ink">PQ codes, codebook, pages</text>
<text x="568" y="264" class="f s" fill="var(--d-teal-ink,#0d6b62)" text-anchor="middle">encrypted</text>
<text x="768" y="264" class="f s" fill="var(--d-amber-ink,#8d5a1d)" text-anchor="middle">in clear</text>

<text x="42" y="290" class="f b ink">full-text (fts5) index</text>
<text x="568" y="290" class="f s" fill="var(--d-red-ink,#993a30)" text-anchor="middle">never exists</text>
<text x="768" y="290" class="f s" fill="var(--d-amber-ink,#8d5a1d)" text-anchor="middle">built, and used as a prefilter</text>

<text x="42" y="316" class="f b" fill="var(--d-red-ink,#993a30)">drawer metadata (meta_json)</text>
<text x="568" y="316" class="f s" fill="var(--d-red-ink,#993a30)" text-anchor="middle">UNSEALED</text>
<text x="768" y="316" class="f s" fill="var(--d-red-ink,#993a30)" text-anchor="middle">UNSEALED</text>

<line x1="42" y1="330" x2="858" y2="330" stroke="var(--d-line,#c9d4dd)" stroke-width="1"/>
<text x="42" y="352" class="f b ink">per-row HMAC tag</text>
<text x="568" y="352" class="f s" fill="var(--d-green-ink,#22603c)" text-anchor="middle">always — verified on every read</text>
<text x="768" y="352" class="f s" fill="var(--d-green-ink,#22603c)" text-anchor="middle">always</text>

<text x="42" y="378" class="f b ink">audit chain entry</text>
<text x="568" y="378" class="f s" fill="var(--d-green-ink,#22603c)" text-anchor="middle">always — same transaction</text>
<text x="768" y="378" class="f s" fill="var(--d-green-ink,#22603c)" text-anchor="middle">always</text>

<rect x="24" y="422" width="418" height="88" rx="9" fill="var(--d-teal-bg,#f2fbfa)" stroke="var(--d-teal,#12897e)" stroke-width="1.5"/>
<text x="42" y="446" class="f l" fill="var(--d-teal-ink,#0d6b62)">The standing rule for a sealed vault</text>
<text x="42" y="467" class="f s dim">No plaintext, and nothing derived from plaintext, is written to</text>
<text x="42" y="482" class="f s dim">disk in clear. Search runs over decrypt-once RAM caches, and</text>
<text x="42" y="497" class="f s dim">any new derived artifact has to follow the same pattern.</text>

<rect x="454" y="422" width="422" height="88" rx="9" fill="var(--d-amber-bg,#fdf6ee)" stroke="var(--d-amber,#b5762a)" stroke-width="1.5"/>
<text x="472" y="446" class="f l" fill="var(--d-amber-ink,#8d5a1d)">When HmacOnly is the right answer</text>
<text x="472" y="467" class="f s dim">The database stays readable with ordinary SQLite tools and the</text>
<text x="472" y="482" class="f s dim">lexical prefilter exists, which matters at scale. You are trading</text>
<text x="472" y="497" class="f s dim">confidentiality for inspectability — not integrity, which stays.</text>

<rect x="24" y="526" width="852" height="174" rx="9" fill="var(--d-red-bg,#fdf2f1)" stroke="var(--d-red,#b5453a)" stroke-width="1.6"/>
<text x="42" y="550" class="f l" fill="var(--d-red-ink,#993a30)">What an attacker holding a SEALED database file can still read</text>
<text x="42" y="570" class="f s dim">Measured against the actual bytes, not asserted. meta_json is stored unsealed so it can be filtered in SQL, and these fields sit inside it:</text>

<rect x="42" y="582" width="816" height="30" rx="6" fill="var(--d-card,#ffffff)" stroke="var(--d-red,#b5453a)" stroke-width="1.1"/>
<text x="56" y="602" class="f mono" fill="var(--d-red-ink,#993a30)">wing · room · source_file · added_by · hall · kind · content_date · resolved dates · supersedes · agent/channel/session</text>

<text x="42" y="632" class="f s dim">They read <tspan class="f s" fill="var(--d-green-ink,#22603c)">no word of the content itself</tspan>. But in practice a wing is a person or a case, a room is a topic, and a source path carries a username</text>
<text x="42" y="647" class="f s dim">and a project — so until this closes, treat those names as public labels and keep the secret out of the name.</text>
<text x="42" y="668" class="f s dim">Pinned by a test that fails in BOTH directions: it fails if content ever leaks, and it fails if a listed field stops being readable — so shrinking</text>
<text x="42" y="683" class="f s dim">the exposure forces the inventory to be updated rather than letting it quietly go stale.</text>

<rect x="24" y="716" width="852" height="90" rx="9" fill="var(--d-card,#ffffff)" stroke="var(--d-line,#c9d4dd)" stroke-width="1.5"/>
<text x="42" y="740" class="f l ink">Closing it does not mean giving up queryability — both halves already exist in the engine</text>
<text x="42" y="762" class="f s dim">Fields that must be filtered in SQL (wing, room) become a <tspan class="f s" fill="var(--d-blue-ink,#33527d)">keyed blind index</tspan> — store a truncated HMAC and filter on that, exactly as</text>
<text x="42" y="777" class="f s dim">duplicate detection already does with its keyed fingerprint. Everything else moves into a <tspan class="f s" fill="var(--d-blue-ink,#33527d)">sealed blob with a RAM cache</tspan>, exactly as</text>
<text x="42" y="792" class="f s dim">embeddings, PQ codes and ColBERT matrices already are. The pattern for having both is in use four times over.</text>
</svg>
