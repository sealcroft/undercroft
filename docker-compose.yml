# Undercroft test + run harness. Everything executes inside containers.
#
#   docker compose run --rm test          # unit + integration tests (cargo)
#   docker compose run --rm e2e           # end-to-end UI/UX suite against the real binary
#   docker compose run --rm backends-e2e  # remote index suite (starts qdrant/chroma/pgvector)
#   docker compose run --rm obs-config    # alert rules + alertmanager route (promtool/amtool)
#   docker compose run --rm site          # build, assemble and check the website
#   docker compose run --rm onnx-build    # compile check for the ONNX embedder feature
#
#   bash tests/battery.sh                 # all eight suites, one tree, raw exit codes
#   docker compose run --rm cli --help    # any CLI command
#   docker compose run --rm -i mcp        # MCP stdio server

# The project name is DECLARED, never derived. Undeclared, Compose takes it
# from the DIRECTORY the file sits in, so every container, image, volume and
# network this repo builds inherits whatever the clone happens to be called —
# on the maintainer's machine that was the project's FORMER name, which
# therefore branded every build artifact while appearing in no file.
#
# It is the seventh class of name occurrence, and the one the six-class trace
# verifier (.handover/verify-no-trace.py) structurally cannot see: it scans
# tracked file CONTENTS, and this name was in none of them. A negative result
# is only as good as the widest question you thought to ask.
#
# It also silently falsified a doc: CLAUDE.md's volume-mount recipe names
# `undercroft_undercroft-embed-tls`, a volume that did not exist while the
# prefix was derived from the former name — and the sentence beside it warns
# that a wrong volume name mounts a fresh EMPTY volume with no error.
# Declaring the name makes that recipe true.
#
# The former name is DESCRIBED here and never spelled, which is not squeamish:
# quoting it puts it back into a tracked file, and `.handover/verify-no-trace.py`
# is right to fail on that. The first draft of this very comment did it.
name: undercroft

services:
  test:
    build:
      context: .
      target: test
    command: ["cargo", "test", "--release"]

  # The CI lint gate (rustfmt + clippy, warnings-as-errors), runnable
  # locally so a push never fails on formatting. Use --build after code
  # changes, like the other suites:
  #   docker compose run --rm --build lint
  lint:
    build:
      context: .
      target: test
    entrypoint: ["sh", "-c"]
    command:
      - "rustup component add rustfmt clippy >/dev/null 2>&1 && cargo fmt --all --check && cargo clippy --all-targets -- -D warnings"

  e2e:
    build:
      context: .
      target: builder
    entrypoint: ["bash", "/src/tests/e2e.sh"]
    volumes:
      - ./tests/e2e.sh:/src/tests/e2e.sh:ro

  # Multi-tenant orchestrator suite: two engine instances + the
  # orchestrator control plane in one container.
  #   docker compose run --rm orchestrator-e2e
  orchestrator-e2e:
    build:
      context: .
      target: builder
    entrypoint: ["bash", "/src/tests/e2e-orchestrator.sh"]
    volumes:
      - ./tests/e2e-orchestrator.sh:/src/tests/e2e-orchestrator.sh:ro

  # Every backend is reached over TLS, because the engine refuses cleartext
  # http to a non-loopback host with no override (ROADMAP C8): a push
  # carries embeddings, and an embedding is plaintext-derived. The four
  # HTTP backends terminate at the `backends-tls` Caddy; pgvector speaks
  # its own protocol and terminates TLS in the server itself. The suite
  # concatenates BOTH roots into one PEM and pins it — a declared CA
  # replaces the public roots, and `rustls_pemfile::certs` reads every
  # certificate in the file, which is what lets one declaration cover two
  # authorities.
  backends-e2e:
    build:
      context: .
      target: builder
    entrypoint: ["bash", "/src/tests/e2e-backends.sh"]
    environment:
      UNDERCROFT_QDRANT_URL: https://qdrant-tls
      UNDERCROFT_CHROMA_URL: https://chroma-tls
      UNDERCROFT_PGVECTOR_DSN: postgresql://undercroft:undercroft@pgvector:5432/undercroft?sslmode=require
      UNDERCROFT_MILVUS_URL: https://milvus-tls
      UNDERCROFT_WEAVIATE_URL: https://weaviate-tls
      # Written by the suite itself from the two mounted roots.
      UNDERCROFT_INDEX_CA: /tmp/backends-roots.pem
    depends_on:
      - backends-tls
      - qdrant
      - chroma
      - pgvector
      - milvus
      - weaviate
    volumes:
      - ./tests/e2e-backends.sh:/src/tests/e2e-backends.sh:ro
      - undercroft-backends-tls:/tls:ro
      - undercroft-pgvector-tls:/pgtls:ro

  # TLS in front of the four HTTP backends. One Caddy, one site block per
  # backend — each on its own hostname rather than a path prefix, because
  # the backends' APIs own their paths.
  backends-tls:
    image: caddy:2.8
    depends_on:
      - qdrant
      - chroma
      - milvus
      - weaviate
    volumes:
      - ./deploy/backends-tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - undercroft-backends-tls:/data
    # One container answering four names. Compose only resolves the SERVICE
    # name, so each virtual host needs an alias or the client cannot reach
    # it — and a per-backend hostname is what lets each site block proxy to
    # its own upstream without rewriting paths.
    networks:
      default:
        aliases:
          - qdrant-tls
          - chroma-tls
          - milvus-tls
          - weaviate-tls

  # A self-signed certificate for the pgvector server, generated once into
  # a shared volume. Self-signed means the certificate is its own trust
  # root, which is exactly what `sslmode=verify-full` + a pinned root
  # needs — and the SAN has to be the compose hostname or verification
  # fails on the name rather than on the chain, which reads as a config
  # bug instead of the check working.
  pgvector-certs:
    image: alpine:3.20
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ ! -s /certs/server.key ]; then
          apk add --no-cache openssl >/dev/null
          # A real two-certificate chain, not a self-signed leaf: rustls
          # validates a server certificate against a trust ANCHOR, and a
          # leaf that is its own anchor is not a chain it will build. The
          # suite pins ca.crt; the server presents server.crt.
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650             -keyout /certs/ca.key -out /certs/ca.crt             -subj "/CN=undercroft-pgvector-ca"
          openssl req -newkey rsa:2048 -nodes             -keyout /certs/server.key -out /certs/server.csr             -subj "/CN=pgvector"
          { echo "subjectAltName=DNS:pgvector"; echo "extendedKeyUsage=serverAuth"; } > /certs/ext.cnf
          openssl x509 -req -in /certs/server.csr -CA /certs/ca.crt -CAkey /certs/ca.key             -CAcreateserial -out /certs/server.crt -days 3650 -extfile /certs/ext.cnf
        fi
        # Postgres refuses a key any other user can read, and runs as uid
        # 999 in this image.
        chmod 600 /certs/server.key
        chown 999:999 /certs/server.key /certs/server.crt
    volumes:
      - undercroft-pgvector-tls:/certs

  onnx-build:
    build:
      context: .
      target: builder
    command: ["cargo", "build", "--release", "-p", "undercroft-cli", "--features", "onnx"]

  # Compile-check the optional ONNX Runtime (ort) backend, wired through the
  # CLI alongside tract (both features together — the strongest coexistence
  # check). Unlike the pure-Rust tract backend it links ORT's C++ library, so
  # it needs pkg-config/openssl/g++.
  ort-build:
    build:
      context: .
      target: builder
    entrypoint: ["bash", "-c"]
    command:
      - "apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev g++ >/dev/null 2>&1 && cargo build --release -p undercroft-cli --features onnx,ort"

  # Observability end-to-end suite. Builds the CLI with --features telemetry
  # (like onnx-build), then exercises the opt-in /metrics gating and that
  # traffic advances the Prometheus counters.
  #   docker compose run --rm e2e-telemetry
  e2e-telemetry:
    build:
      context: .
      target: builder
    entrypoint: ["bash", "-c"]
    command:
      - "cargo build --release -p undercroft-cli --features telemetry && bash /src/tests/e2e-telemetry.sh"
    volumes:
      - ./tests/e2e-telemetry.sh:/src/tests/e2e-telemetry.sh:ro

  # The observability CONFIG suite: promtool + amtool, at the versions the
  # stack deploys, over deploy/observability. Validates the alert rules, runs
  # their unit tests, validates the Alertmanager route, and checks the join
  # between them — that the inhibition is scoped by a label every alert
  # actually emits. It equalled on one nothing emitted, and Alertmanager
  # reads absent-on-both as equal, so a single critical muted every warning
  # in the fleet with nothing anywhere reporting it.
  #
  #   docker compose run --rm --build obs-config
  obs-config:
    build:
      context: .
      dockerfile: deploy/observability/Dockerfile.config-check
    volumes:
      - ./deploy:/src/deploy:ro
      - ./tests/obs-config.sh:/src/tests/obs-config.sh:ro

  bench:
    build:
      context: .
      target: builder
    command: ["/src/target/release/undercroft-bench", "synth", "--n", "200"]

  # A quantized text embedder served on the compose network, CPU only —
  # reached through the `embeddings-tls` terminator, never directly: the
  # engine refuses cleartext http to any non-loopback host, no override
  # (crates/undercroft-llm/src/embed.rs).
  #
  #   docker compose up -d embeddings embeddings-tls
  #   docker compose run --rm embed-pull            # once: fetch the model
  #   # NB the volume must be named with the project prefix — a bare
  #   # `undercroft-embed-tls` mounts a fresh empty volume silently:
  #   docker compose run --rm -v undercroft_undercroft-embed-tls:/tls:ro \
  #     -e UNDERCROFT_EMBEDDER=http \
  #     -e UNDERCROFT_EMBED_URL=https://embeddings-tls \
  #     -e UNDERCROFT_EMBED_CA=/tls/caddy/pki/authorities/local/root.crt \
  #     -e UNDERCROFT_EMBED_MODEL=nomic-embed-text bench
  #
  # Why a container rather than a desktop runtime on the host: everything this
  # project measures runs in Docker, and a benchmark that reaches out to an app
  # on the developer's machine is neither reproducible nor reachable from the
  # bench container. This is on the compose network, pinned by digest-able tag,
  # and CPU-only — no GPU, so a second machine gets the same numbers rather
  # than the same numbers divided by whatever accelerator was present.
  #
  # `UNDERCROFT_EMBED_API` is inferred from the URL: this one has no `/v1`, so
  # the native Ollama route is used. Append `/v1` to exercise the
  # OpenAI-compatible route instead — the same server answers both, which makes
  # it a fair test of either shape.
  embeddings:
    image: ollama/ollama:0.11.4
    environment:
      # Keep it honest about the CPU claim: no GPU is requested anywhere, and
      # the model stays resident so per-request latency is not a cold start.
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - undercroft-models:/root/.ollama

  # The shipped TLS terminator (deploy/embeddings-tls/Caddyfile): Caddy's
  # internal CA signs a cert for `embeddings-tls`; the CA root lands on
  # the `undercroft-embed-tls` volume at
  # /data/caddy/pki/authorities/local/root.crt, which clients mount
  # read-only and PIN via UNDERCROFT_EMBED_CA (the declaration replaces
  # the public roots — a pin, not an addition). This container is the
  # only holder of the private key; the engine never needs one.
  embeddings-tls:
    image: caddy:2.8
    depends_on:
      - embeddings
    volumes:
      - ./deploy/embeddings-tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - undercroft-embed-tls:/data

  # One-time model fetch into the shared volume. Separate from `embeddings` so
  # the download is an explicit act, not a side effect of starting a service.
  embed-pull:
    image: ollama/ollama:0.11.4
    depends_on:
      - embeddings
    entrypoint: ["sh", "-c"]
    command:
      - "OLLAMA_HOST=http://embeddings:11434 ollama pull ${UNDERCROFT_EMBED_MODEL:-nomic-embed-text}"
    volumes:
      - undercroft-models:/root/.ollama

  qdrant:
    image: qdrant/qdrant:v1.12.4

  chroma:
    image: chromadb/chroma:1.0.0

  pgvector:
    image: pgvector/pgvector:pg16
    depends_on:
      pgvector-certs:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: undercroft
      POSTGRES_PASSWORD: undercroft
      POSTGRES_DB: undercroft
    # TLS in the server, not in a proxy: Postgres speaks its own protocol,
    # so there is nothing for the HTTP terminator to front.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    volumes:
      - undercroft-pgvector-tls:/certs:ro

  milvus:
    image: milvusdb/milvus:v2.4.15
    command:
      - bash
      - -c
      - |
        mkdir -p /milvus/configs
        cat > /milvus/configs/embedEtcd.yaml <<'YAML'
        listen-client-urls: http://0.0.0.0:2379
        advertise-client-urls: http://0.0.0.0:2379
        quota-backend-bytes: 4294967296
        auto-compaction-mode: revision
        auto-compaction-retention: '1000'
        YAML
        exec milvus run standalone
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local

  weaviate:
    image: semitechnologies/weaviate:1.25.10
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1

  # Build the documentation site (mdBook). Slow first run (compiles mdbook).
  #   docker compose run --rm site   → website/book/
  site:
    build:
      context: .
      target: builder
    working_dir: /src
    # Same version the pages workflow pins — the two builds must not drift,
    # or the manual's sidebar markup/behavior differs between preview and live.
    # Builds AND assembles, through the same script the Pages workflow runs,
    # because the checks that matter are true only of the assembled site:
    # the manual's stylesheet reaches the fonts by a path that leaves the
    # book and re-enters the landing assets, and that path resolves only
    # once both halves are in one tree.
    command: ["sh", "-c", "cargo install mdbook --version 0.5.4 --locked --quiet && bash website/build-site.sh"]
    volumes:
      - ./website:/src/website
      # The book sources {{#include}} files from the repo root.
      - ./README.md:/src/README.md:ro
      - ./docs:/src/docs:ro

  cli:
    build:
      context: .
      target: runtime
    volumes:
      - undercroft-data:/data

  mcp:
    build:
      context: .
      target: runtime
    stdin_open: true
    command: ["serve-mcp"]
    volumes:
      - undercroft-data:/data

volumes:
  undercroft-data:
  # Embedding model weights, so `embed-pull` is a one-time download.
  undercroft-models:
  # The embeddings-tls terminator's CA material — clients mount this
  # read-only and pin the root via UNDERCROFT_EMBED_CA.
  # The backends terminator's CA material, and the pgvector server's own
  # self-signed certificate. The suite pins BOTH.
  undercroft-backends-tls:
  undercroft-pgvector-tls:
  undercroft-embed-tls:
