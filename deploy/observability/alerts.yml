# Prometheus alerting rules for Undercroft.
#
# The headline rule is PalaceTamperDetected: any HMAC-verify failure means a
# record, KG triple, tunnel, or vault manifest failed its integrity tag on
# read — i.e. on-disk tampering was caught. The `surface` label says WHERE.
# See RUNBOOK.md (the operator quick-reference) for how to respond; the full
# runbook the alerts' runbook_url links to is website/src/runbook.md,
# published at /docs/runbook.html.
#
# **Every rule below preserves `instance`, and that is load-bearing rather
# than cosmetic.** `alertmanager.yml` inhibits warnings while a critical is
# firing and has to compare the two on *something*; Alertmanager treats a
# label absent from BOTH sides as equal, so an `equal:` on a label no
# expression emits does not scope the inhibition — it makes it global, and
# one tamper alert anywhere silences every warning fleet-wide. A bare
# `sum(...)` drops `instance` along with everything else, which is how five
# of the six rules this file then held came to emit no shared label at all.
# Keep `instance` in every aggregation, and check any new rule against
# `alerts_test.yml`, which asserts the exact label set each one produces.
#
# The per-instance form is also the more useful alert: it names the process
# that is slow or erroring instead of reporting that somebody, somewhere, is.

groups:
  - name: undercroft-integrity
    rules:
      - alert: PalaceTamperDetected
        # Fire the instant a verify failure is observed, per surface. No
        # aggregation, so `job`, `instance` and `surface` all survive.
        expr: increase(undercroft_hmac_verify_failures_total[2m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Tamper detected — HMAC verify failed on {{ $labels.surface }}"
          description: >-
            {{ $value | printf "%.0f" }} HMAC-verify failure(s) on surface
            '{{ $labels.surface }}' in the last 2m. A stored record failed its
            integrity tag on read — treat as on-disk tampering until proven
            otherwise. Confirm with `undercroft verify`; follow the runbook.
          runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

      - alert: AuditChainHeightHigh
        # ROADMAP O250. `undercroft_audit_chain_height` has been a dashboard
        # panel since the stack shipped and had NO rule anywhere in this
        # directory, so an operator saw a number with nothing to read it
        # against. The trail is append-only and has no compaction — it cannot
        # have one, because the replay starts at a constant and a stored
        # start head would make `DELETE FROM audit` verify clean — so this
        # number only ever goes up, and what it buys an operator is notice.
        #
        # The threshold is a LITERAL here rather than a comparison against
        # the engine's `UNDERCROFT_AUDIT_CEILING`, deliberately: every rule
        # in this file carries its own, this is a deployment config an
        # operator edits, and the two answer different audiences — the
        # engine's ceiling is what its own stats surfaces report against.
        #
        # 10^6 is the one height at which the cost was MEASURED rather than
        # extrapolated: a full chain replay took 836 ms at 1,002,001 rows
        # against 88 ms at 102,001, and every handle pays one on its first
        # guarded read. No aggregation, so `job`, `instance` and `vault` all
        # survive — `alertmanager.yml` inhibits on `instance`.
        expr: undercroft_audit_chain_height > 1000000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit trail is large — every handle's first guarded read walks it"
          description: >-
            Vault '{{ $labels.vault }}' holds {{ $value | printf "%.0f" }}
            audit-chain records. Nothing is wrong and nothing should be
            deleted — the trail is the evidence — but the label guard replays
            it once per handle, which was measured at 836ms per replay at
            10^6 records. Expect slower first reads after a restart, and
            consider `export` into a fresh vault if this keeps growing.
          runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

      - alert: AuditChainReplaysRepeating
        # ROADMAP O250, and this is the rule that would have caught O242.
        # The label guard replays the whole chain AT MOST ONCE per handle;
        # it re-runs only when `PRAGMA data_version` says another connection
        # committed. So a sustained rate here is not routine — it is a second
        # writer moving the cookie under a long-lived server, and each move
        # costs the next guarded read a walk of the entire `audit` table.
        # That was a +213% regression on `serve-http` for a whole release and
        # it was found by a reviewer reading code, because the count lived in
        # `#[cfg(test)]`.
        #
        # 30 in 15m is two a minute sustained. Stated honestly: a
        # multi-tenant instance pays one first-replay per vault, so handle
        # churn contributes — that is a real cost and worth seeing, and the
        # threshold is yours to raise. The window carries "sustained" instead
        # of a `for:`, so the rule and its test evaluate at one point.
        expr: sum by (instance) (increase(undercroft_chain_replays_total[15m])) > 30
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Audit-chain replays are repeating — a second writer is moving the cookie"
          description: >-
            {{ $value | printf "%.0f" }} full audit-chain replays in 15m on
            this instance. The guard is designed to replay once per handle,
            so a sustained rate means another connection keeps committing and
            every commit costs the next guarded read a walk of the whole
            audit table. Check for a second process writing the served vault.
          runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

      - alert: AuditChainStalled
        # Writes are landing but the tamper-evident chain isn't advancing.
        # Both sides of the `and` aggregate by the same label, or the vector
        # match finds no counterpart and the rule never fires.
        expr: sum by (instance) (rate(undercroft_drawer_writes_total[5m])) > 0 and sum by (instance) (rate(undercroft_chain_commits_total[5m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit chain is not advancing while writes are happening"
          description: >-
            Drawer writes are being recorded but no audit-chain commits have
            occurred in 10m. The tamper-evident chain may be stuck; investigate
            before trusting integrity guarantees.
          runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

  - name: undercroft-health
    rules:
      - alert: UndercroftDown
        expr: up{job="undercroft"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Undercroft /metrics target is down"
          description: "Prometheus cannot scrape undercroft:8765/metrics for 1m."

      - alert: HighSearchLatencyP95
        # `le` must survive the sum for the quantile to mean anything;
        # `histogram_quantile` then consumes it and returns the rest.
        expr: histogram_quantile(0.95, sum by (instance, le) (rate(undercroft_search_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Search p95 latency above 500ms"
          description: "p95 search latency has exceeded 500ms for 10m ({{ $value | printf \"%.3f\" }}s)."

      - alert: HttpServerErrors
        expr: sum by (instance) (rate(undercroft_http_requests_total{status=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Undercroft is returning HTTP 5xx"
          description: "5xx responses observed for 5m — the server is erroring on some requests."

      - alert: EmbedFailures
        # ROADMAP O122. A served or in-process embedder degraded an embed to
        # a ZERO VECTOR: the drawer landed verbatim and stays lexically
        # findable, but its semantic leg is dead until re-embedded. The write
        # path never fails on this by design, so the counter is the only
        # durable evidence — the live count is `embed_failures` on stats.
        # Fires on the first one: a single hole is a hole, and the endpoint
        # that produced it is usually still failing.
        expr: sum by (instance) (increase(undercroft_embed_failures_total[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Embeds are degrading to zero vectors"
          description: >-
            The embedder behind this instance degraded at least one embed to a
            zero vector in the last 10m — drawers written meanwhile are
            lexically findable but semantically invisible. Check the embeddings
            endpoint or model, then re-embed with UNDERCROFT_FORCE_EMBEDDER=1 +
            `undercroft repair`.

      - alert: RerankFailures
        # ROADMAP O131. A cross-encoder pass failed and the candidate was
        # scored 0.0 — which `search` writes over its fusion score before
        # re-sorting, so the candidate SINKS and is then indistinguishable
        # from a genuinely irrelevant passage. Unlike a degraded embed it
        # leaves no artifact at rest, so this counter is the only evidence
        # the failure happened at all. Its own series rather than a label on
        # the embed counter (maintainer ruling, 2026-09-08).
        expr: sum by (instance) (increase(undercroft_rerank_failures_total[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Reranker scores are degrading to zero"
          description: >-
            The cross-encoder behind this instance degraded at least one score
            to 0.0 in the last 10m. Those candidates sank to the bottom of the
            reranked window and cannot be told from irrelevant passages
            afterwards. Check the reranker model and endpoint; searches served
            meanwhile were ranked on incomplete evidence.

      - alert: LateInteractionFailures
        # ROADMAP O131. The `side` label says which half failed and they are
        # not equally bad: `doc` is a WRITE-path failure that leaves the
        # drawer with no token matrix at rest (a durable hole), `query`
        # retires the late stage for one search. Aggregated by instance AND
        # side so the alert can say which — both survive the sum.
        expr: sum by (instance, side) (increase(undercroft_late_failures_total[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Late-interaction encodes are degrading ({{ $labels.side }} side)"
          description: >-
            The ColBERT encoder degraded at least one {{ $labels.side }}-side
            encode to an empty matrix in the last 10m. A doc-side failure
            leaves that drawer with no token matrix at rest — re-encode with
            `undercroft repair --tokens` (UNDERCROFT_RERANKER=colbert or
            colbert-ort; CLI only); a query-side failure silently retired the
            late stage for those searches.

      - alert: AuthRejectionsSpike
        expr: sum by (instance) (rate(undercroft_auth_rejections_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated auth rejections"
          description: >-
            Bearer/assertion rejections are elevated (> 0.2/s for 10m) —
            could be a misconfigured client or a credential-probing attempt.
