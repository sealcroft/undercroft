# Alertmanager routing for the Undercroft stack.
#
# All alerts route to the in-stack `alert-sink` webhook (a tiny receiver that
# logs delivered alerts to stdout) so you can see the whole path — rule fires
# in Prometheus, routes here, gets delivered — without any external creds.
# Swap in Slack/email/PagerDuty by uncommenting a receiver below and pointing
# the route at it.

global:
  resolve_timeout: 5m

route:
  receiver: alert-sink
  # `vault` was in this list and no alert expression emits it — grouping on
  # a label nothing produces silently collapses every alert into one group.
  # `instance` is the label every rule in alerts.yml is aggregated by;
  # `surface` exists only on the tamper alert, which is where it belongs.
  group_by: ["alertname", "instance", "surface"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    # Tamper / integrity alerts page immediately (no group_wait).
    - matchers:
        - severity = "critical"
      receiver: alert-sink
      group_wait: 0s
      continue: true

receivers:
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink:9094/alert
        send_resolved: true

  # --- swap-ins (uncomment + fill, then point the route at them) ---
  # - name: slack
  #   slack_configs:
  #     - api_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
  #       channel: "#undercroft-alerts"
  #       title: "{{ .CommonAnnotations.summary }}"
  #       text: "{{ .CommonAnnotations.description }}"
  # - name: email
  #   email_configs:
  #     - to: "oncall@example.com"
  #       from: "undercroft@example.com"
  #       smarthost: "smtp.example.com:587"

inhibit_rules:
  # A critical alert on an instance silences noisier warnings FOR THAT
  # INSTANCE.
  #
  # This said `equal: ["vault"]` and no alert expression emitted a `vault`
  # label — every rule was a `sum()`, an `up{}` or a `sum by (le)` over
  # counters that carry no vault at all. **Alertmanager treats a label
  # missing from both source and target as equal**, so the rule matched
  # every warning in the fleet: one PalaceTamperDetected anywhere muted
  # every HighSearchLatencyP95, HttpServerErrors, AuthRejectionsSpike and
  # AuditChainStalled everywhere, for as long as it fired. The comment said
  # "for it"; the behaviour was global, and nothing distinguished the two
  # because the label was absent rather than mismatched.
  #
  # `instance` is emitted by all six rules — the aggregations in alerts.yml
  # keep it deliberately — and `alerts_test.yml` asserts each one's exact
  # label set through `promtool test rules`, so a new rule that drops it is
  # a failing suite rather than a silent widening of this inhibition.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["instance"]
