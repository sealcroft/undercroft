# Unit tests for alerts.yml, run by `promtool test rules` (tests/obs-config.sh).
#
# **What this exists to catch.** `alertmanager.yml` silences warnings while a
# critical is firing, and scopes that with `equal:` on a label. Alertmanager
# treats a label absent from BOTH sides as equal, so an `equal:` naming a
# label no rule emits does not scope the inhibition — it makes it global. The
# shipped config equalled on `vault`, which nothing emitted, so one
# PalaceTamperDetected muted every warning in the fleet. Nothing could see it:
# the config was valid, the rules were valid, and the failure was an alert
# that never arrived.
#
# So each block below asserts the **exact label set** a rule produces, which
# is the observable the defect moves. `promtool` evaluates the real PromQL
# against real series, so this cannot agree with the rules by construction the
# way a second copy of the expressions would. The companion check in
# tests/obs-config.sh then requires every label in alertmanager's `equal:`
# list to appear in every `exp_labels` block here — which closes the loop:
# promtool proves these expectations are what the rules really emit, and the
# script proves the inhibition is scoped by something they all carry.
#
# Adding a rule? Add a block, and add a quiet arm for it to the negative
# control at the bottom. A rule with no block is not covered: the script
# fails for any rule in alerts.yml whose name has no `alertname:` line here.
# It does not yet check for the quiet arm, so that half is by eye.

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # ── PalaceTamperDetected — the critical, and the inhibition's source ──────
  # No aggregation at all, so every scrape label survives: this is the one
  # rule that was never in doubt, and it is here because the inhibition is
  # only correctly scoped if the SOURCE carries `instance` too.
  - interval: 1m
    input_series:
      - series: 'undercroft_hmac_verify_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",surface="drawer"}'
        values: "0 0 0 0 1 2"
    alert_rule_test:
      - eval_time: 5m
        alertname: PalaceTamperDetected
        exp_alerts:
          - exp_labels:
              alertname: PalaceTamperDetected
              severity: critical
              job: undercroft
              instance: undercroft:8765
              service: undercroft
              surface: drawer
            exp_annotations:
              summary: "Tamper detected — HMAC verify failed on drawer"
              description: "2 HMAC-verify failure(s) on surface 'drawer' in the last 2m. A stored record failed its integrity tag on read — treat as on-disk tampering until proven otherwise. Confirm with `undercroft verify`; follow the runbook."
              runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

  # ── AuditChainHeightHigh — the trail is large ─────────────────────────────
  # ROADMAP O250. No aggregation in the rule, so every scrape label survives
  # — `vault` included, which the annotation names. This is the first rule in
  # this file to carry a `vault` label; `alertmanager.yml` equals on
  # `instance` alone, so that is the one the join check requires.
  - interval: 1m
    input_series:
      - series: 'undercroft_audit_chain_height{job="undercroft",instance="undercroft:8765",service="undercroft",vault="default"}'
        values: "1000001+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: AuditChainHeightHigh
        exp_alerts:
          - exp_labels:
              alertname: AuditChainHeightHigh
              severity: warning
              job: undercroft
              instance: undercroft:8765
              service: undercroft
              vault: default
            exp_annotations:
              summary: "Audit trail is large — every handle's first guarded read walks it"
              description: "Vault 'default' holds 1000001 audit-chain records. Nothing is wrong and nothing should be deleted — the trail is the evidence — but the label guard replays it once per handle, which was measured at 836ms per replay at 10^6 records. Expect slower first reads after a restart, and consider `export` into a fresh vault if this keeps growing."
              runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

  # ── AuditChainReplaysRepeating — the rule that would have caught O242 ─────
  # Five replays a minute for the whole window: the guard is designed to run
  # one per handle, so this is a second writer moving `PRAGMA data_version`.
  # `sum by (instance)` keeps the label the inhibition scopes on and drops
  # the rest, which is what the `exp_labels` block below has to say.
  - interval: 1m
    input_series:
      - series: 'undercroft_chain_replays_total{job="undercroft",instance="undercroft:8765",service="undercroft"}'
        values: "0+5x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: AuditChainReplaysRepeating
        exp_alerts:
          - exp_labels:
              alertname: AuditChainReplaysRepeating
              severity: warning
              instance: undercroft:8765
            exp_annotations:
              summary: "Audit-chain replays are repeating — a second writer is moving the cookie"
              description: "75 full audit-chain replays in 15m on this instance. The guard is designed to replay once per handle, so a sustained rate means another connection keeps committing and every commit costs the next guarded read a walk of the whole audit table. Check for a second process writing the served vault."
              runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

  # ── ManifestAnchorHandleRetired / ManifestAnchorDeferred (ROADMAP O254) ──
  # One integrity-class failure and one I/O-class failure inside the window.
  # `sum by (instance)` keeps the label the inhibition scopes on; the `class`
  # selector is in the expression, so it does not reach the alert.
  - interval: 1m
    input_series:
      - series: 'undercroft_anchor_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",class="integrity"}'
        values: "0+0x9 1+0x10"
      - series: 'undercroft_anchor_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",class="io"}'
        values: "0+0x9 1+0x10"
    alert_rule_test:
      - eval_time: 15m
        alertname: ManifestAnchorHandleRetired
        exp_alerts:
          - exp_labels:
              alertname: ManifestAnchorHandleRetired
              severity: critical
              instance: undercroft:8765
            exp_annotations:
              summary: "A handle stopped writing: its manifest anchor refused the vault.json on disk"
              description: "A post-commit anchor on this instance found a vault.json its keys may not overwrite, and that handle now refuses every write. Another process rotated this vault's keys beside it, or the manifest was edited or removed. The vault's stats name the vault under unhealed; restart the process, then run undercroft verify."
              runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"
      - eval_time: 15m
        alertname: ManifestAnchorDeferred
        exp_alerts:
          - exp_labels:
              alertname: ManifestAnchorDeferred
              severity: warning
              instance: undercroft:8765
            exp_annotations:
              summary: "Manifest anchors are being deferred"
              description: "A post-commit anchor on this instance could not write vault.json (a filesystem refusal or a busy write lock). The write it followed is stored and the next anchor covers it. Check the vault directory's disk and permissions, and anything else holding vault.json open."
              runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

  # ── AuditChainStalled — writes landing, chain not advancing ───────────────
  # Both sides of the `and` must aggregate by the same label or the vector
  # match finds no counterpart and the rule silently never fires. That is a
  # second, independent way to break this rule while the config stays valid.
  - interval: 1m
    input_series:
      - series: 'undercroft_drawer_writes_total{job="undercroft",instance="undercroft:8765",service="undercroft",outcome="created"}'
        values: "0+1x20"
      - series: 'undercroft_chain_commits_total{job="undercroft",instance="undercroft:8765",service="undercroft"}'
        values: "5+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: AuditChainStalled
        exp_alerts:
          - exp_labels:
              alertname: AuditChainStalled
              severity: warning
              instance: undercroft:8765
            exp_annotations:
              summary: "Audit chain is not advancing while writes are happening"
              description: "Drawer writes are being recorded but no audit-chain commits have occurred in 10m. The tamper-evident chain may be stuck; investigate before trusting integrity guarantees."
              runbook_url: "https://sealcroft.com/undercroft/docs/runbook.html"

  # ── UndercroftDown — the other critical ──────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'up{job="undercroft",instance="undercroft:8765",service="undercroft"}'
        values: "0+0x5"
    alert_rule_test:
      - eval_time: 5m
        alertname: UndercroftDown
        exp_alerts:
          - exp_labels:
              alertname: UndercroftDown
              severity: critical
              job: undercroft
              instance: undercroft:8765
              service: undercroft
            exp_annotations:
              summary: "Undercroft /metrics target is down"
              description: "Prometheus cannot scrape undercroft:8765/metrics for 1m."

  # ── HighSearchLatencyP95 ─────────────────────────────────────────────────
  # `le` has to survive the sum for the quantile to mean anything and must
  # NOT survive the alert; `sum by (instance, le)` is the only form that gets
  # both right. All observations land in (0.1, 1], so p95 interpolates to
  # 0.1 + 0.9*0.95 = 0.955.
  - interval: 1m
    input_series:
      - series: 'undercroft_search_duration_seconds_bucket{job="undercroft",instance="undercroft:8765",service="undercroft",le="0.1"}'
        values: "0+0x20"
      - series: 'undercroft_search_duration_seconds_bucket{job="undercroft",instance="undercroft:8765",service="undercroft",le="1"}'
        values: "0+10x20"
      - series: 'undercroft_search_duration_seconds_bucket{job="undercroft",instance="undercroft:8765",service="undercroft",le="+Inf"}'
        values: "0+10x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighSearchLatencyP95
        exp_alerts:
          - exp_labels:
              alertname: HighSearchLatencyP95
              severity: warning
              instance: undercroft:8765
            exp_annotations:
              summary: "Search p95 latency above 500ms"
              description: "p95 search latency has exceeded 500ms for 10m (0.955s)."

  # ── HttpServerErrors ─────────────────────────────────────────────────────
  # Two 5xx series on one instance: the aggregation must fold them into ONE
  # alert, not one per route, or a broken deploy pages once per handler.
  - interval: 1m
    input_series:
      - series: 'undercroft_http_requests_total{job="undercroft",instance="undercroft:8765",service="undercroft",route="v1_search",status="500"}'
        values: "0+1x20"
      - series: 'undercroft_http_requests_total{job="undercroft",instance="undercroft:8765",service="undercroft",route="v1_save",status="503"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: HttpServerErrors
        exp_alerts:
          - exp_labels:
              alertname: HttpServerErrors
              severity: warning
              instance: undercroft:8765
            exp_annotations:
              summary: "Undercroft is returning HTTP 5xx"
              description: "5xx responses observed for 5m — the server is erroring on some requests."

  # ── EmbedFailures (ROADMAP O122) ─────────────────────────────────────────
  # Two backends' series on one instance fold into ONE alert, and `instance`
  # survives the sum — the label every rule must keep for the inhibition to
  # scope itself. Fires at the first increase: `for: 0m`.
  - interval: 1m
    input_series:
      - series: 'undercroft_embed_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="http"}'
        values: "0+1x20"
      - series: 'undercroft_embed_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="onnx"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: EmbedFailures
        exp_alerts:
          - exp_labels:
              alertname: EmbedFailures
              severity: warning
              instance: undercroft:8765
            exp_annotations:
              summary: "Embeds are degrading to zero vectors"
              description: "The embedder behind this instance degraded at least one embed to a zero vector in the last 10m — drawers written meanwhile are lexically findable but semantically invisible. Check the embeddings endpoint or model, then re-embed with UNDERCROFT_FORCE_EMBEDDER=1 + `undercroft repair`."

  # ── RerankFailures (ROADMAP O131) ────────────────────────────────────────
  # Two backends on one instance fold into ONE alert and `instance` survives.
  - interval: 1m
    input_series:
      - series: 'undercroft_rerank_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="onnx"}'
        values: "0+2x20"
      - series: 'undercroft_rerank_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="ort"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: RerankFailures
        exp_alerts:
          - exp_labels:
              alertname: RerankFailures
              severity: warning
              instance: undercroft:8765
            exp_annotations:
              summary: "Reranker scores are degrading to zero"
              description: "The cross-encoder behind this instance degraded at least one score to 0.0 in the last 10m. Those candidates sank to the bottom of the reranked window and cannot be told from irrelevant passages afterwards. Check the reranker model and endpoint; searches served meanwhile were ranked on incomplete evidence."

  # ── LateInteractionFailures (ROADMAP O131) ───────────────────────────────
  # `side` is deliberately KEPT by the aggregation, so a doc-side failure (a
  # durable hole at rest) and a query-side one (transient) alert separately
  # and each names itself. Two sides firing means two alerts, which is the
  # intent — asserted here so a later `sum by (instance)` cannot quietly
  # collapse them into one that says neither.
  - interval: 1m
    input_series:
      - series: 'undercroft_late_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="onnx",side="doc"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: LateInteractionFailures
        exp_alerts:
          - exp_labels:
              alertname: LateInteractionFailures
              severity: warning
              instance: undercroft:8765
              side: doc
            exp_annotations:
              summary: "Late-interaction encodes are degrading (doc side)"
              description: "The ColBERT encoder degraded at least one doc-side encode to an empty matrix in the last 10m. A doc-side failure leaves that drawer with no token matrix at rest — re-encode with `undercroft repair --tokens` (UNDERCROFT_RERANKER=colbert or colbert-ort; CLI only); a query-side failure silently retired the late stage for those searches."

  # ── AuthRejectionsSpike ──────────────────────────────────────────────────
  # 30/min = 0.5/s, over the 0.2/s threshold.
  - interval: 1m
    input_series:
      - series: 'undercroft_auth_rejections_total{job="undercroft",instance="undercroft:8765",service="undercroft"}'
        values: "0+30x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: AuthRejectionsSpike
        exp_alerts:
          - exp_labels:
              alertname: AuthRejectionsSpike
              severity: warning
              instance: undercroft:8765
            exp_annotations:
              summary: "Elevated auth rejections"
              description: "Bearer/assertion rejections are elevated (> 0.2/s for 10m) — could be a misconfigured client or a credential-probing attempt."

  # ── The negative control ─────────────────────────────────────────────────
  # A healthy instance fires nothing. Without this, a rule that fired
  # unconditionally would satisfy every block above.
  #
  # Every rule needs a PRESENT, healthy series here, not merely an absent
  # one: an expression over an empty vector returns nothing whatever its
  # comparison says, so a quiet arm with no input would pass `> 0` mutated
  # to `>= 0` just as happily. This block covered four of the nine rules
  # until 2026-09-14, and the other five passed every test while being
  # unable to show they stay quiet.
  #
  # Search: every observation lands at or under 0.1s, so p95 interpolates to
  # 0.095, under the 0.5s threshold. HTTP: a 200 route climbing and a 5xx
  # route present but flat, so the 5xx selector matches a zero rate rather
  # than nothing. Failure counters: present and flat.
  - interval: 1m
    input_series:
      - series: 'up{job="undercroft",instance="undercroft:8765",service="undercroft"}'
        values: "1+0x20"
      - series: 'undercroft_drawer_writes_total{job="undercroft",instance="undercroft:8765",service="undercroft",outcome="created"}'
        values: "0+1x20"
      - series: 'undercroft_chain_commits_total{job="undercroft",instance="undercroft:8765",service="undercroft"}'
        values: "0+1x20"
      - series: 'undercroft_hmac_verify_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",surface="drawer"}'
        values: "0+0x20"
      - series: 'undercroft_auth_rejections_total{job="undercroft",instance="undercroft:8765",service="undercroft"}'
        values: "0+0x20"
      - series: 'undercroft_search_duration_seconds_bucket{job="undercroft",instance="undercroft:8765",service="undercroft",le="0.1"}'
        values: "0+10x20"
      - series: 'undercroft_search_duration_seconds_bucket{job="undercroft",instance="undercroft:8765",service="undercroft",le="1"}'
        values: "0+10x20"
      - series: 'undercroft_search_duration_seconds_bucket{job="undercroft",instance="undercroft:8765",service="undercroft",le="+Inf"}'
        values: "0+10x20"
      - series: 'undercroft_http_requests_total{job="undercroft",instance="undercroft:8765",service="undercroft",route="v1_search",status="200"}'
        values: "0+1x20"
      - series: 'undercroft_http_requests_total{job="undercroft",instance="undercroft:8765",service="undercroft",route="v1_save",status="500"}'
        values: "0+0x20"
      - series: 'undercroft_embed_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="http"}'
        values: "0+0x20"
      - series: 'undercroft_rerank_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="onnx"}'
        values: "0+0x20"
      - series: 'undercroft_late_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="onnx",side="doc"}'
        values: "0+0x20"
      - series: 'undercroft_late_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",backend="onnx",side="query"}'
        values: "0+0x20"
      # O250. A healthy trail well under the 10^6 threshold, and a replay
      # counter that is PRESENT and flat — one replay at open and no more,
      # which is what the guard is designed to do. Present rather than
      # absent for the reason at the top of this block: an expression over
      # an empty vector returns nothing whatever its comparison says.
      - series: 'undercroft_audit_chain_height{job="undercroft",instance="undercroft:8765",service="undercroft",vault="default"}'
        values: "4096+0x20"
      - series: 'undercroft_chain_replays_total{job="undercroft",instance="undercroft:8765",service="undercroft"}'
        values: "1+0x20"
      # O254. Both classes PRESENT and flat — no anchor has failed. The lag is
      # not a series at all, deliberately: nothing may alert on it.
      - series: 'undercroft_anchor_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",class="integrity"}'
        values: "0+0x20"
      - series: 'undercroft_anchor_failures_total{job="undercroft",instance="undercroft:8765",service="undercroft",class="io"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: UndercroftDown
        exp_alerts: []
      - eval_time: 15m
        alertname: PalaceTamperDetected
        exp_alerts: []
      - eval_time: 15m
        alertname: AuditChainStalled
        exp_alerts: []
      - eval_time: 15m
        alertname: HighSearchLatencyP95
        exp_alerts: []
      - eval_time: 15m
        alertname: HttpServerErrors
        exp_alerts: []
      - eval_time: 15m
        alertname: EmbedFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: RerankFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: LateInteractionFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: AuthRejectionsSpike
        exp_alerts: []
      - eval_time: 15m
        alertname: AuditChainHeightHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: AuditChainReplaysRepeating
        exp_alerts: []
      - eval_time: 15m
        alertname: ManifestAnchorHandleRetired
        exp_alerts: []
      - eval_time: 15m
        alertname: ManifestAnchorDeferred
        exp_alerts: []
