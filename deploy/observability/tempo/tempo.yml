# Minimal Tempo (local storage) — receives OTLP spans from undercroft.
# Undercroft exports OTLP/HTTP to https://tempo-tls (UNDERCROFT_OTLP_ENDPOINT,
# pinned via UNDERCROFT_OTLP_CA), which terminates TLS and proxies to tempo:4318.

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
