# Undercroft observability stack — the full picture: metrics, logs, traces,
# and alerting, rendered in Grafana.
#
#   undercroft (telemetry) ──/metrics──▶ Prometheus ──rules──▶ Alertmanager ──▶ alert-sink
#             │  │                          │                                    (webhook)
#             │  └──JSON logs──▶ promtail ──▶ Loki ──┐
#             └──OTLP traces────────────────▶ Tempo ─┤
#                                                    └──▶ Grafana (+ image-renderer for PNGs)
#
#   cd deploy/observability
#   docker compose -f docker-compose.observability.yml up --build
#
#   # Grafana:      http://localhost:3000   (dashboard: "Undercroft — Palace")
#   # Prometheus:   http://localhost:9090   (Alerts tab shows rule state)
#   # Alertmanager: http://localhost:9093
#   # Palace Monitor: http://localhost:8765/monitor
#
# The undercroft image is built with `--features telemetry`; UNDERCROFT_METRICS=1
# turns /metrics on, UNDERCROFT_LOG_FORMAT=json makes logs structured for Loki,
# and UNDERCROFT_OTLP_ENDPOINT ships traces to Tempo. Everything is metadata /
# counts only — never drawer content or key material.
#
# DEMO TOKEN: UNDERCROFT_MCP_HTTP_TOKEN and Prometheus' scrape credential share
# one fixed value for turnkey local use. NOT a secret — change both for
# anything beyond localhost. The exposed Docker-less services (Loki/Tempo/
# Alertmanager) are unauthenticated; keep this stack on localhost.

# Declared, not derived — see the note in the repo-root docker-compose.yml.
# Its own name, because this stack is brought up ALONGSIDE the others and
# sharing a project would let `down -v` on one destroy another's volumes.
name: undercroft-observability

services:
  undercroft:
    build:
      context: ../..
      args:
        UNDERCROFT_FEATURES: telemetry
    restart: unless-stopped
    # The terminator must exist before the engine resolves its pin: the
    # engine REFUSES to start when the declared CA file is unreadable, which
    # is deliberate (a pin that silently un-pins is the failure mode).
    depends_on:
      - tempo-tls
    # Create the palace + default vault on first run, then serve.
    entrypoint: ["/bin/sh", "-c"]
    command: ["undercroft init 2>/dev/null || true; exec undercroft serve-http --host 0.0.0.0 --port 8765"]
    environment:
      # Palace lives on the named volume.
      UNDERCROFT_HOME: /data
      UNDERCROFT_MCP_HTTP_TOKEN: ${UNDERCROFT_MCP_HTTP_TOKEN:-undercroft-observability-demo-token}
      UNDERCROFT_METRICS: "1"
      UNDERCROFT_LOG: "warn,undercroft=info"
      UNDERCROFT_LOG_FORMAT: "json"
      # TLS, through the terminator below. Cleartext http to a non-loopback
      # host is REFUSED with no override — the OTLP hop obeys the same
      # transport policy as every other outbound client since round-four #8.
      # The pin is Caddy's internal CA root, which REPLACES the public roots.
      UNDERCROFT_OTLP_ENDPOINT: "https://tempo-tls"
      UNDERCROFT_OTLP_CA: /tls/caddy/pki/authorities/local/root.crt
      UNDERCROFT_SERVICE_NAME: "undercroft"
    volumes:
      - undercroft-data:/data
      - tempo-tls-data:/tls:ro
    ports:
      - "8765:8765"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - undercroft
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  alert-sink:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "/app/sink.py"]
    volumes:
      - ./alert-sink/sink.py:/app/sink.py:ro

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read container logs via the Docker API (read-only).
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  # TLS terminator for the OTLP hop. Mirrors deploy/embeddings-tls/ — the
  # engine will not send traces in the clear to a non-loopback host, so the
  # shipped stack terminates TLS here and the engine pins Caddy's internal
  # CA root off the shared volume.
  tempo-tls:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - tempo
    volumes:
      - ./tempo-tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - tempo-tls-data:/data

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous read access for a frictionless local look; lock this down
      # (or remove) for any shared deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Let the vault admin console (GET /ui, GRAFANA tab) iframe the
      # dashboard; without this Grafana sends X-Frame-Options: deny.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Let the anonymous viewer open Explore — the dashboard's trace and
      # log panels deep-link there, and without this a click bounces to
      # the Grafana welcome page instead of the trace view.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      # Server-side PNG rendering (for exported screenshots) via the sidecar.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"

volumes:
  undercroft-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  tempo-tls-data:
  grafana-data:
