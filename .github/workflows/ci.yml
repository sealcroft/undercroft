name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The host-side preflights. They live in `tests/battery.sh` because no image
  # carries `ROADMAP.md`, the compose files, or `.gitattributes`' whole scope —
  # and until this job existed the script was named in this workflow only
  # inside comments, so every one of them gated a local run and NOTHING on a
  # pull request. Cheapest job here and the fastest to fail: no Docker, no
  # cargo, seconds.
  preflight:
    name: Preflights (line endings, ROADMAP, compose, CI inventory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/battery.sh --preflight-only

  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    container: rust:1.90-slim-bookworm
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      # The TELEMETRY build (ROADMAP O84). The line above lints default
      # members with DEFAULT features, so everything behind
      # `#[cfg(feature = "telemetry")]` was linted by nothing — two dead
      # wrappers in `undercroft-obs` survived from O20 and O25 that way.
      #
      # Repeated here rather than only in the `lint` compose service because
      # THIS job is what fails a pull request: it runs cargo directly, in a
      # rust container with no docker, so it cannot go through
      # `tests/battery.sh` the way M13 routed the suite legs. The two copies
      # are counted against each other by the `lint parity` preflight.
      - name: clippy (telemetry feature)
        run: |
          cargo clippy -p undercroft-cli --features telemetry --all-targets -- -D warnings
          cargo clippy -p undercroft-orchestrator --features telemetry --all-targets -- -D warnings

  # NOTHING IN THIS PROJECT COMPILED FOR WINDOWS ON A PULL REQUEST, and
  # `release.yml` — which does — only runs on a TAG. So a Windows-only compile
  # error was invisible until the one moment it can no longer be fixed without
  # a new version. That is not hypothetical: `1.2.1` shipped 16 assets instead
  # of 20 because O90's fix named `tokio_postgres::config::Host::Unix`, a
  # variant that is `#[cfg(unix)]` and does not exist off unix. The battery and
  # all seventeen other jobs run in Linux containers and were green.
  #
  # `cargo check` and not a build: the defect class is cfg-gated code that does
  # not COMPILE for the target, and checking catches every one of those in a
  # fraction of the time. Linking is `release.yml`'s job.
  #
  # The whole workspace minus the two heavy ML crates, matching what
  # `release.yml` actually builds for this target.
  windows-check:
    name: Windows target compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (x86_64-pc-windows-msvc)
        run: cargo check --workspace --all-targets --exclude undercroft-embed-onnx --exclude undercroft-embed-ort

  audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  trivy-fs:
    name: Trivy scan (source, secrets, configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  suites:
    # The leg is named `suite (<name>)`, never the bare suite name. A job's
    # `name` IS the status context GitHub publishes, so with `name: ${{
    # matrix.suite }}` one leg published a context literally called `test` —
    # colliding with the id of the aggregate below, and making the obvious
    # required check ("test") resolve to one cargo suite out of seven.
    name: suite (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      # **Every suite runs even when one fails.** Serially, a failure in the
      # second step meant the remaining five never ran, so one broken suite
      # hid the state of the rest and a fix landed blind. The point of a
      # battery is the whole verdict, not the first word of it.
      fail-fast: false
      matrix:
        # These are compose service names. This comment used to claim they are
        # "the same strings `tests/battery.sh` uses, so CI and a local battery
        # cannot drift into different sets" — measured, the sets differ in BOTH
        # directions and always have: the matrix has `onnx-build` and the
        # battery does not; the battery has `lint` and `site`, which CI runs as
        # their own jobs; and `ort-build` is a compose service run by neither,
        # while `release.yml` ships an `ort` binary for all five targets.
        # Nothing counted them, so the claim survived by assertion. The
        # reconciliation is filed in ROADMAP O9 — what is fixed here is the
        # verdict, not yet the sets.
        #
        #   obs-config       alert rules + route (promtool/amtool) — no cargo
        #   test             cargo unit + integration
        #   e2e              UI/UX suite against the release binary
        #   orchestrator-e2e two engines + the control plane
        #   e2e-telemetry    the ONLY job compiling `--features telemetry`;
        #                    without it `undercroft-obs/src/imp.rs` — the whole
        #                    real telemetry implementation — is never built in
        #                    CI at all and could stop compiling on `main` with
        #                    every check green
        #   backends-e2e     five live vector DBs over TLS
        #   onnx-build       ONNX embedder + reranker compile check
        #   arch-check       the architecture reference is what diagrams/ and
        #                    its own headings derive to — no build, a stock
        #                    python image, and a read-only mount because the
        #                    check must write nothing (ROADMAP M14)
        suite:
          - obs-config
          - arch-check
          - test
          - e2e
          - orchestrator-e2e
          - e2e-telemetry
          - backends-e2e
          - onnx-build
    steps:
      - uses: actions/checkout@v5
      # Through `battery.sh`, not `docker compose run` directly. The script
      # runs the suite, captures its exit code WITHOUT a pipe, and then
      # compares the suite's MEASURED check count against the figure CLAUDE.md
      # publishes for it — a comparison only a RUN can perform, which is why
      # it cannot be a preflight and why, until ROADMAP M13, it happened
      # nowhere on a pull request. A leg dropping from 370 checks to 3 was
      # green. `--no-preflight` skips the host-side preflights, which
      # the dedicated `preflight` job above already runs once.
      #
      # It also gets `--build` (the script always passes it) and the narrowed
      # backends reset for free, so CI and a local battery run the same code
      # rather than two implementations that agree until they do not.
      - name: ${{ matrix.suite }}
        run: bash tests/battery.sh --no-preflight ${{ matrix.suite }}

  # THE VERDICT. This is the one context a required status check should be
  # configured against, and everything about its old shape was wrong:
  #
  #   * its comment said it was "kept under the name `test` because that is
  #     what any required status check on `main` is configured against". No
  #     repo had `required_status_checks` at all — verified against the API on
  #     both `undercroft` and `sealcroft.github.io` — so it gated nothing and
  #     the sentence describing why it must not be renamed was protecting a
  #     configuration that did not exist;
  #   * the published context is a job's `name`, not its id, so the context was
  #     `Suites (aggregate)` and never `test` in the first place, while the
  #     matrix leg above published one literally called `test`;
  #   * `needs: suites` left `lint`, `audit`, `trivy-fs`, `site` and
  #     `trivy-image` outside the verdict entirely — five jobs free to go red
  #     under a green aggregate.
  #
  # Named `CI verdict` now: a context no leg can collide with, and one that
  # says what requiring it means.
  tls-pins:
    name: TLS pins are readable by the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No cargo, no image build: three small public images and a permission
      # question. `deploy/observability` shipped UNSTARTABLE for two releases
      # because the engine pinned a path inside Caddy's root-only PKI tree,
      # and nothing here ever brought a terminator up to notice — `obs-config`
      # validates config FILES and starts no container.
      #
      # Driven through `battery.sh` for the same reason as the matrix legs
      # above: this suite is HOST-SIDE, and the post-run figure comparison used
      # to be compose-shaped, so `tls-pins` was the one suite whose published
      # count was never compared to anything on a pull request OR locally.
      # ROADMAP M13.
      - run: bash tests/battery.sh --no-preflight tls-pins

  house-figures:
    name: House page figures match the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ROADMAP O65. The house page publishes figures about THIS engine from a
      # repository with no CI that nothing here reads, so the drift is
      # invisible on both sides: round four filed "656 tests" against a tree
      # running 689, and eleven days later it was 765. Its sibling — the house
      # serving cleartext — went the same way and is what O37 calls "the most
      # severe process failure".
      #
      # **This is the only check in the tree that needs the INTERNET**, which
      # is why it is a CI job rather than a `tests/battery.sh` preflight: the
      # preflights run on every local battery and a network arm there would
      # fail for anyone working offline. Unreachable is a FAILURE inside the
      # script, never a skip — an unreachable page and an accurate one must
      # not produce the same verdict.
      #
      # It can therefore go red on a pull request that touched nothing: the
      # house page is state this repo does not own. That is the point. A red
      # tick naming a stale published figure is the signal; the alternative is
      # the eleven days.
      - run: bash tests/house-figures.sh

  verdict:
    name: CI verdict
    runs-on: ubuntu-latest
    needs: [preflight, lint, audit, trivy-fs, suites, site, trivy-image, tls-pins, house-figures, windows-check]
    if: always()
    steps:
      - name: Every job must have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          n=$(printf '%s' "$NEEDS" | jq 'length')
          # PREMISE PROBE, and the half a workflow can enforce on itself. A
          # narrowed `needs:` cannot quietly shrink the verdict — the count is
          # asserted, not assumed. The other direction (a NEW job nobody added
          # to `needs:`) is unreachable from here, because a workflow cannot
          # enumerate its own jobs; `tests/battery.sh`'s CI-inventory preflight
          # reads the file and closes it.
          if [ "$n" -lt 10 ]; then
            echo "the verdict covers only $n job(s) and must cover 10 —"
            echo "someone narrowed needs:, which is how a green tick stops meaning anything"
            exit 1
          fi
          # Every upstream is inspected. Reading `needs.suites.result` alone is
          # what let five jobs sit in the workflow and outside the verdict:
          # naming the ones you check is an inventory maintained by memory.
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "not green — see the individual jobs above:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "all $n upstream jobs succeeded"

  site:
    name: Site build + assembly checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same mdBook version as pages.yml and the compose `site` service —
      # three callers, one version, or the preview and the deploy differ.
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      # The deploy runs this exact script. Running it on pull requests is
      # what makes a broken site a failing check instead of a broken page:
      # pages.yml only fires on `main`, so until now nothing built the book
      # before it was already published.
      - run: bash website/build-site.sh _site

  trivy-image:
    name: Trivy scan (runtime image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build runtime image
        run: docker build -t undercroft:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: undercroft:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
