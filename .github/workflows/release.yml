# On every version tag: build prebuilt binaries for the four desktop/server
# targets and attach them to the GitHub release, and publish the runtime
# container image to GHCR. Default cargo features only — offline, zero
# telemetry, exactly what `docker build` produces.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create/upload release assets
  packages: write # push ghcr.io images

jobs:
  binaries:
    name: Binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-13 was GitHub's last Intel runner image and is retired —
          # jobs targeting it queue forever. The Intel binary cross-compiles
          # from the Apple Silicon runner (Apple's toolchain does this
          # natively; rustup just needs the target).
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --target "${{ matrix.target }}" \
            -p undercroft-cli -p undercroft-orchestrator
      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="undercroft-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          BIN=target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "$BIN/undercroft.exe" "$BIN/undercroft-orchestrator.exe" "dist/${NAME}/"
          else
            cp "$BIN/undercroft" "$BIN/undercroft-orchestrator" "dist/${NAME}/"
          fi
          cp LICENSE NOTICE README.md SECURITY.md "dist/${NAME}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "${NAME}.zip" "${NAME}" >/dev/null
            ARCHIVE="${NAME}.zip"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          fi
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=dist/${ARCHIVE}" >> "$GITHUB_ENV"
      - name: Upload to the release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The release may not exist yet (it is normally created right
          # after the tag push) — create a placeholder if we get here first.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" || true
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber

  # The `ort` posture as a ready configuration (docs/EMBEDDERS.md): one
  # feature-built binary asset so UNDERCROFT_EMBEDDER=ort is reachable
  # from a download, not a compile. Deliberately scoped to linux x86_64
  # as the first increment — the deployable-server case — and verified
  # self-contained (the ort build links ONNX Runtime statically; no
  # shared library ships beside the binary, probed 2026-08-04).
  binaries-ort:
    name: Binaries (x86_64-unknown-linux-gnu, ort)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Build with the in-process embedder features
        run: cargo build --release -p undercroft-cli --features onnx,ort
      - name: Smoke — the features are compiled in and wired
        run: |
          BIN=target/release/undercroft
          "$BIN" --help > /dev/null
          export UNDERCROFT_HOME="$(mktemp -d)"
          "$BIN" vault create smoke
          # An ort-built binary asked for the ort embedder without model
          # files must fail on MODEL CONFIGURATION ("loading ORT
          # embedder: ..."), never on a missing feature — the latter is
          # what a default binary says, and shipping one under this
          # asset name would be the silent failure this probe exists to
          # catch. Full inference needs a user-supplied model export
          # (docs/EMBEDDERS.md), which is why the smoke stops here.
          set +e
          OUT="$(UNDERCROFT_EMBEDDER=ort "$BIN" remember probe --vault smoke 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -ne 0 ] || { echo "expected a model-config refusal"; exit 1; }
          echo "$OUT" | grep -q "loading ORT embedder" || {
            echo "wrong failure shape — is the ort feature actually compiled in?"; exit 1; }
      - name: Package and upload
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="undercroft-${TAG}-x86_64-unknown-linux-gnu-ort"
          mkdir -p "dist/${NAME}"
          cp target/release/undercroft "dist/${NAME}/"
          cp LICENSE NOTICE README.md SECURITY.md "dist/${NAME}/"
          cd dist
          tar -czf "${NAME}.tar.gz" "${NAME}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" || true
          gh release upload "$TAG" "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" --clobber

  # Each architecture builds natively (no QEMU emulation — a full Rust
  # build under emulation is unreasonably slow), then one job merges the
  # per-arch images into a single multi-arch manifest.
  docker:
    name: GHCR image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/compufreq/undercroft:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # The :ort image variant — the in-process posture as a pullable image
  # (docs/EMBEDDERS.md). amd64-only first increment, same deliberate
  # scope as the binary asset; the ort build is statically linked, so
  # the unchanged runtime stage carries everything it needs.
  docker-ort:
    name: GHCR image (amd64, ort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            UNDERCROFT_FEATURES=onnx,ort
          tags: ghcr.io/compufreq/undercroft:${{ github.ref_name }}-ort
          cache-from: type=gha,scope=amd64-ort
          cache-to: type=gha,mode=max,scope=amd64-ort
      - name: Smoke — the pushed image carries the ort feature
        run: |
          IMG="ghcr.io/compufreq/undercroft:${GITHUB_REF_NAME}-ort"
          docker run --rm "$IMG" --help > /dev/null
          # /data is ephemeral per `docker run`, so create-then-probe
          # shares a named volume.
          docker volume create ort-smoke > /dev/null
          docker run --rm -v ort-smoke:/data "$IMG" vault create smoke
          set +e
          OUT="$(docker run --rm -v ort-smoke:/data -e UNDERCROFT_EMBEDDER=ort "$IMG" remember probe --vault smoke 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -ne 0 ] || { echo "expected a model-config refusal"; exit 1; }
          echo "$OUT" | grep -q "loading ORT embedder" || {
            echo "wrong failure shape — is the ort feature in the image?"; exit 1; }

  manifest:
    name: Multi-arch manifest
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Merge per-arch images
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMG="ghcr.io/compufreq/undercroft"
          # Image labels do not surface on a multi-arch index — GHCR reads
          # the description from an index-level annotation.
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=Hardened local-first AI memory: encrypted, integrity-verified vaults with verbatim recall, hybrid retrieval, MCP + multi-tenant REST" \
            --annotation "index:org.opencontainers.image.source=https://github.com/compufreq/undercroft" \
            --annotation "index:org.opencontainers.image.licenses=BUSL-1.1" \
            -t "${IMG}:${TAG}" -t "${IMG}:latest" \
            "${IMG}:${TAG}-amd64" "${IMG}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMG}:${TAG}"
