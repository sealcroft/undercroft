# On every version tag: build prebuilt binaries for the four desktop/server
# targets and attach them to the GitHub release, and publish the runtime
# container image to GHCR. Default cargo features only — offline, zero
# telemetry, exactly what `docker build` produces.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create/upload release assets
  packages: write # push ghcr.io images

jobs:
  binaries:
    name: Binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-13 was GitHub's last Intel runner image and is retired —
          # jobs targeting it queue forever. The Intel binary cross-compiles
          # from the Apple Silicon runner (Apple's toolchain does this
          # natively; rustup just needs the target).
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --target "${{ matrix.target }}" \
            -p undercroft-cli -p undercroft-orchestrator
      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="undercroft-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          BIN=target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "$BIN/undercroft.exe" "$BIN/undercroft-orchestrator.exe" "dist/${NAME}/"
          else
            cp "$BIN/undercroft" "$BIN/undercroft-orchestrator" "dist/${NAME}/"
          fi
          cp LICENSE NOTICE README.md SECURITY.md "dist/${NAME}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "${NAME}.zip" "${NAME}" >/dev/null
            ARCHIVE="${NAME}.zip"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          fi
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=dist/${ARCHIVE}" >> "$GITHUB_ENV"
      - name: Upload to the release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The release may not exist yet (it is normally created right
          # after the tag push) — create a placeholder if we get here first.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" || true
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber

  # The `ort` posture as a ready configuration (docs/EMBEDDERS.md): a
  # feature-built binary asset per target, so UNDERCROFT_EMBEDDER=ort is
  # reachable from a download, not a compile, on every platform the
  # default binaries ship for. (v0.45.0 shipped linux x86_64 as the
  # stated first increment; this is the stated second.) The smoke runs
  # against the PACKAGED layout, not the build tree — a binary that
  # secretly needs a shared library beside it fails here, at CI, not on
  # a user's machine. Packaging also carries any onnxruntime runtime
  # library the ort build drops beside the binary: on every probed
  # target the link is static and nothing matches, but if a platform's
  # prebuilt ever goes dynamic the asset stays self-contained and the
  # packaged-layout smoke proves the pair works from a fresh directory.
  binaries-ort:
    name: Binaries (${{ matrix.target }}, ort)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Intel macOS cross-compiles from the Apple Silicon runner,
          # exactly as in `binaries`; its smoke runs under Rosetta 2
          # (installed below — a no-op when already present).
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Build with the in-process embedder features
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --target "${{ matrix.target }}" \
            -p undercroft-cli --features onnx,ort
      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="undercroft-${TAG}-${{ matrix.target }}-ort"
          mkdir -p "dist/${NAME}"
          BIN=target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "$BIN/undercroft.exe" "dist/${NAME}/"
          else
            cp "$BIN/undercroft" "dist/${NAME}/"
          fi
          # Carry a dynamic ONNX Runtime if the build produced one (see
          # the job comment — static everywhere probed, but never ship
          # a binary whose library stayed behind in the build tree).
          find "$BIN" -maxdepth 1 \( -name 'libonnxruntime*' -o -name 'onnxruntime*.dll' \) \
            -exec cp {} "dist/${NAME}/" \;
          cp LICENSE NOTICE README.md SECURITY.md "dist/${NAME}/"
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
      - name: Install Rosetta for the cross-compiled Intel smoke
        if: matrix.target == 'x86_64-apple-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Smoke — the packaged binary carries the ort feature
        shell: bash
        run: |
          BIN="dist/${NAME}/undercroft"
          [[ "${{ matrix.target }}" == *windows* ]] && BIN="${BIN}.exe"
          "$BIN" --help > /dev/null
          SMOKE_HOME="$(mktemp -d)"
          # Git Bash paths confuse a native Windows binary; hand it a
          # mixed-form path (C:/...) instead.
          command -v cygpath >/dev/null && SMOKE_HOME="$(cygpath -m "$SMOKE_HOME")"
          export UNDERCROFT_HOME="$SMOKE_HOME"
          "$BIN" vault create smoke
          # An ort-built binary asked for the ort embedder without model
          # files must fail on MODEL CONFIGURATION ("loading ORT
          # embedder: ..."), never on a missing feature — the latter is
          # what a default binary says, and shipping one under this
          # asset name would be the silent failure this probe exists to
          # catch. Full inference needs a user-supplied model export
          # (docs/EMBEDDERS.md), which is why the smoke stops here.
          set +e
          OUT="$(UNDERCROFT_EMBEDDER=ort "$BIN" remember probe --vault smoke 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -ne 0 ] || { echo "expected a model-config refusal"; exit 1; }
          echo "$OUT" | grep -q "loading ORT embedder" || {
            echo "wrong failure shape — is the ort feature actually compiled in?"; exit 1; }
      - name: Upload to the release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "${NAME}.zip" "${NAME}" >/dev/null
            ARCHIVE="${NAME}.zip"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          fi
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" || true
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber

  # Each architecture builds natively (no QEMU emulation — a full Rust
  # build under emulation is unreasonably slow), then one job merges the
  # per-arch images into a single multi-arch manifest.
  docker:
    name: GHCR image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/compufreq/undercroft:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # The :ort image variant — the in-process posture as a pullable image
  # (docs/EMBEDDERS.md), now per-arch native builds merged into one
  # :tag-ort manifest exactly like the default image (v0.45.0 shipped
  # amd64-only as the stated first increment; this is the stated
  # second). The ort build is statically linked, so the unchanged
  # runtime stage carries everything it needs; each arch smokes its own
  # pushed image natively before the manifest exists.
  docker-ort:
    name: GHCR image (${{ matrix.arch }}, ort)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            UNDERCROFT_FEATURES=onnx,ort
          tags: ghcr.io/compufreq/undercroft:${{ github.ref_name }}-ort-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}-ort
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-ort
      - name: Smoke — the pushed image carries the ort feature
        run: |
          IMG="ghcr.io/compufreq/undercroft:${GITHUB_REF_NAME}-ort-${{ matrix.arch }}"
          docker run --rm "$IMG" --help > /dev/null
          # /data is ephemeral per `docker run`, so create-then-probe
          # shares a named volume.
          docker volume create ort-smoke > /dev/null
          docker run --rm -v ort-smoke:/data "$IMG" vault create smoke
          set +e
          OUT="$(docker run --rm -v ort-smoke:/data -e UNDERCROFT_EMBEDDER=ort "$IMG" remember probe --vault smoke 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -ne 0 ] || { echo "expected a model-config refusal"; exit 1; }
          echo "$OUT" | grep -q "loading ORT embedder" || {
            echo "wrong failure shape — is the ort feature in the image?"; exit 1; }

  manifest-ort:
    name: Multi-arch manifest (ort)
    needs: docker-ort
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Merge per-arch ort images
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMG="ghcr.io/compufreq/undercroft"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=Hardened local-first AI memory (ort build: in-process ONNX Runtime embedder/reranker/ColBERT compiled in)" \
            --annotation "index:org.opencontainers.image.source=https://github.com/compufreq/undercroft" \
            --annotation "index:org.opencontainers.image.licenses=BUSL-1.1" \
            -t "${IMG}:${TAG}-ort" \
            "${IMG}:${TAG}-ort-amd64" "${IMG}:${TAG}-ort-arm64"
          docker buildx imagetools inspect "${IMG}:${TAG}-ort"

  manifest:
    name: Multi-arch manifest
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Merge per-arch images
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMG="ghcr.io/compufreq/undercroft"
          # Image labels do not surface on a multi-arch index — GHCR reads
          # the description from an index-level annotation.
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=Hardened local-first AI memory: encrypted, integrity-verified vaults with verbatim recall, hybrid retrieval, MCP + multi-tenant REST" \
            --annotation "index:org.opencontainers.image.source=https://github.com/compufreq/undercroft" \
            --annotation "index:org.opencontainers.image.licenses=BUSL-1.1" \
            -t "${IMG}:${TAG}" -t "${IMG}:latest" \
            "${IMG}:${TAG}-amd64" "${IMG}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMG}:${TAG}"
