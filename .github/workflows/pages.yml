name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      # Build + assemble + check, through the same script `docker compose run
      # --rm site` runs. The assembly used to live here as bare `cp` lines,
      # so the local preview could not exercise the deployed layout — which
      # is the only place the cross-directory font and 404 asset paths
      # resolve at all. It fails the deploy rather than publishing a site
      # that fetches fonts from a third party.
      - name: Build, assemble and check the site
        run: bash website/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
