[package]
name = "undercroft-obs"
description = "Observability shim for Undercroft — no-op unless built with the `telemetry` feature"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# All telemetry (structured logs, Prometheus metrics, OTLP export) lives
# behind this feature. With it OFF this crate pulls NO dependencies and
# every entry point compiles to a no-op — default builds are untouched.
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-prometheus",
    "dep:prometheus",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:serde",
    "dep:serde_json",
    # The OTLP hop is an OUTBOUND client, so it obeys the one transport
    # policy like every other. Optional and listed here so the default
    # build still pulls nothing.
    "dep:undercroft-net",
    "dep:ureq",
    "dep:opentelemetry-http",
    "dep:async-trait",
]

[dependencies]
# The OTLP exporter's transport. `undercroft-net` is the ONE implementation
# of "TLS or loopback, nothing else, no override" plus CA pinning; `ureq` is
# named directly because that is how every other consumer of that crate holds
# its policed agent (see `undercroft-llm/src/embed.rs`).
undercroft-net = { path = "../undercroft-net", optional = true }
ureq = { version = "2.10", optional = true }
opentelemetry-http = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-prometheus = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
