[package]
name = "undercroft-vault"
description = "Hardened memory-management layer: isolated vaults, AEAD encryption, HMAC integrity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Failure injection for the manifest anchor's file operations (ROADMAP O254):
# the temp file is named with a random nonce, so nothing outside this crate can
# target it, and the gate has to drive a rename or fsync failure through a
# seam. Off in every production build; `undercroft-store` enables it through a
# DEV-dependency only, on `undercroft-embed-onnx`'s precedent (ROADMAP O134a).
test-fixture = []

[dependencies]
undercroft-core = { path = "../undercroft-core" }
undercroft-obs = { path = "../undercroft-obs" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
x25519-dalek = { workspace = true }
ml-kem = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
zstd = "0.13"

[dev-dependencies]
tempfile = { workspace = true }
