[package]
name = "undercroft-cli"
description = "Undercroft CLI and MCP server — hardened local-first AI memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "undercroft"
path = "src/main.rs"

[features]
# Enables the ONNX sentence-embedder (UNDERCROFT_EMBEDDER=onnx).
# Off by default to keep the standard build lean and fully offline.
onnx = ["dep:undercroft-embed-onnx"]
# Enables the ONNX Runtime backend (UNDERCROFT_EMBEDDER=ort,
# UNDERCROFT_RERANKER=ort|colbert-ort). Same user-supplied models and
# UNDERCROFT_ONNX_*/RERANK_*/COLBERT_* variables as the tract backend,
# ~2.5× faster per forward — but links ONNX Runtime's C++ library, so it
# is opt-in like `onnx` (see the ort-build compose service).
ort = ["dep:undercroft-embed-ort"]
# Enables the experimental in-memory HNSW ANN prefilter
# (UNDERCROFT_RETRIEVAL=hnsw). RAM-only, never persisted.
hnsw = ["undercroft-store/hnsw"]
# Enables observability: structured logs, Prometheus /metrics, OTLP export.
# Off by default (zero extra deps, zero overhead) — see undercroft-obs.
telemetry = ["undercroft-obs/telemetry"]

[dependencies]
undercroft-core = { path = "../undercroft-core" }
undercroft-vault = { path = "../undercroft-vault" }
undercroft-store = { path = "../undercroft-store" }
undercroft-index = { path = "../undercroft-index" }
undercroft-llm = { path = "../undercroft-llm" }
undercroft-obs = { path = "../undercroft-obs" }
undercroft-embed-onnx = { path = "../undercroft-embed-onnx", optional = true }
undercroft-embed-ort = { path = "../undercroft-embed-ort", optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
time = { workspace = true }
tiny_http = "0.12"
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.22"
subtle = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
