[package]
name = "undercroft-orchestrator"
description = "Multi-tenant orchestrator for Undercroft — routing, tenant→vault mapping, key minting, and migration as a separate optional control plane; the engine stays tree-blind"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "undercroft-orchestrator"
path = "src/main.rs"

[features]
# The control plane's own telemetry (ROADMAP O20). It is a pure `/v1` client
# and inherits nothing from the engine, so it needs its own feature — and with
# it OFF this binary pulls no observability dependency at all, exactly as the
# engine's default build does.
telemetry = ["undercroft-obs/telemetry"]

[dependencies]
# Metrics for the control plane. Zero-dependency no-op unless `telemetry` is
# on, so the default build is untouched.
undercroft-obs = { path = "../undercroft-obs" }
# Constant-time comparison for the metrics bearer — the same property the
# admin token and the engine's palace bearer already have.
subtle = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The ONE transport policy: TLS or loopback, nothing else, no override.
# This hop carries the palace bearer, a minted assertion, and drawer
# content during search and migration, and had no policy at all.
undercroft-net = { path = "../undercroft-net" }
# The three declaration parses this binary shares with the engine's
# `config check`, which cannot link this crate (ROADMAP O24).
undercroft-config = { path = "../undercroft-config" }
rusqlite = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
tempfile = { workspace = true }
