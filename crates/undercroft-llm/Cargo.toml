[package]
name = "undercroft-llm"
description = "Local-LLM client (Ollama / OpenAI-compatible) for optional extraction refinement"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
undercroft-core = { path = "../undercroft-core" }
undercroft-obs = { path = "../undercroft-obs" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "2.10", features = ["json"] }
# The exact rustls ureq's `tls` feature compiles (ring provider, no
# aws-lc) — needed only to build the declared-CA `ClientConfig` for
# UNDERCROFT_EMBED_CA. Version and features must stay unified with ureq's
# own declaration or two rustls trees end up in the binary.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

[dev-dependencies]
tiny_http = "0.12"
