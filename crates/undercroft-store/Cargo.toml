[package]
name = "undercroft-store"
description = "SQLite-backed vault storage with hybrid search over sealed or hmac-only vaults"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Local in-memory HNSW ANN prefilter (pure Rust). Off by default; a build
# without it carries zero extra deps. RAM-only index, never persisted — the
# no-plaintext-derived-index-on-disk invariant holds for sealed vaults.
hnsw = ["dep:instant-distance"]

[dependencies]
rayon = { workspace = true }
undercroft-core = { path = "../undercroft-core" }
# The control plane's declaration parses, so `check_declaration` can run the
# SAME code the orchestrator runs rather than a second copy (ROADMAP O24).
undercroft-config = { path = "../undercroft-config" }
undercroft-vault = { path = "../undercroft-vault" }
undercroft-index = { path = "../undercroft-index" }
# The transport policy owns the CA-pin resolver that `config check` drives.
undercroft-net = { path = "../undercroft-net" }
undercroft-obs = { path = "../undercroft-obs" }
base64 = "0.22"
# `backup`: SQLite's online backup API, which `backup create` copies the verified
# snapshot with (ROADMAP O256). A module over functions the bundled SQLite always
# compiles; it adds no crate.
rusqlite = { workspace = true, features = ["backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# The knowledge graph's blind index and its ids are keyed with a per-vault
# secret (A10): HMAC for the derivation, and one CSPRNG draw to mint the
# secret the first time a vault writes a fact.
hmac = { workspace = true }
rand = { workspace = true }
instant-distance = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The anchor's failure-injection seam (ROADMAP O254): a DEV-dependency, so the
# feature reaches this crate's tests and never a production build.
undercroft-vault = { path = "../undercroft-vault", features = ["test-fixture"] }
# ROADMAP O253's interleaving gate: a `progress_handler` on the store's own
# connection commits from a second handle at the Nth VM step of a door. A
# dev-dependency feature, so production code carries no interleave hook.
rusqlite = { workspace = true, features = ["hooks"] }
