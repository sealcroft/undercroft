[package]
name = "undercroft-bench"
description = "Retrieval benchmarks for Undercroft: LongMemEval-format harness + synthetic self-contained benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "undercroft-bench"
path = "src/main.rs"

[features]
# Model-based benchmarking: UNDERCROFT_EMBEDDER=onnx + UNDERCROFT_ONNX_MODEL/_TOKENIZER
onnx = ["dep:undercroft-embed-onnx"]
# Local HNSW ANN prefilter: UNDERCROFT_RETRIEVAL=hnsw
hnsw = ["undercroft-store/hnsw"]

[dependencies]
undercroft-core = { path = "../undercroft-core" }
undercroft-embed-onnx = { path = "../undercroft-embed-onnx", optional = true }
undercroft-vault = { path = "../undercroft-vault" }
undercroft-store = { path = "../undercroft-store" }
undercroft-index = { path = "../undercroft-index" }
undercroft-llm = { path = "../undercroft-llm" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
