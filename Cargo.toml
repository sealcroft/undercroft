[workspace]
resolver = "2"
members = [
    "crates/undercroft-config",
    "crates/undercroft-core",
    "crates/undercroft-vault",
    "crates/undercroft-store",
    "crates/undercroft-index",
    "crates/undercroft-llm",
    "crates/undercroft-net",
    "crates/undercroft-obs",
    "crates/undercroft-cli",
    "crates/undercroft-bench",
    "crates/undercroft-orchestrator",
    "crates/undercroft-embed-onnx",
    "crates/undercroft-embed-ort",
]
# The ONNX embedders pull heavy ML deps (and `ort` links a C++ runtime); they
# are built explicitly (see the `onnx-build` / `ort-build` compose services),
# not by default.
default-members = [
    "crates/undercroft-config",
    "crates/undercroft-core",
    "crates/undercroft-vault",
    "crates/undercroft-store",
    "crates/undercroft-index",
    "crates/undercroft-llm",
    "crates/undercroft-net",
    "crates/undercroft-obs",
    "crates/undercroft-cli",
    "crates/undercroft-bench",
    "crates/undercroft-orchestrator",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/sealcroft/undercroft"
authors = ["compufreq <compufreq@proton.me>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same parser ureq resolves a request target with, so the loopback
# predicate and the transport cannot disagree about what the host is.
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive", "env"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ml-kem = { version = "0.2", features = ["zeroize"] }
# Sender attestation on export bundles (recipient encryption is hybrid
# X25519 + ML-KEM-768 since C3.4; Ed25519 shares curve25519-dalek 4.x).
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hex = "0.4"
unicode-normalization = "0.1"
# Calendar conversion for the calendars that are NOT a renumbered Gregorian
# year: Hijri is lunar, Jalali turns at the equinox. Apache-2.0, maintained by
# the Unicode Consortium under ICU4X, three dependencies, and PURE ALGORITHM —
# no data files to ship or download, which is what makes it acceptable in an
# offline local-first binary. Hand-rolling these was the alternative and the
# tabular Hijri variant is the one that is easy to write and wrong for real
# documents; this carries Umm al-Qura, the Saudi civil calendar.
calendrical_calculations = "0.2"
subtle = "2.6"
tempfile = "3"
instant-distance = "0.6"
rayon = "1"
assert_cmd = "2"
predicates = "3"

# --- observability (undercroft-obs, `telemetry` feature only) ---
# Versions are indicative and reconciled in Cargo.lock, matching the
# loose-pin convention above. Never pulled into a default build.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["metrics", "trace"] }
# NO `reqwest-blocking-client`. That feature linked a SECOND outbound HTTP
# client into a `--features telemetry` build — one `undercroft-net` knew
# nothing about, so it obeyed neither the cleartext refusal nor the CA pin —
# and reqwest resolved with no TLS backend at all, so an `https://` collector
# could not work and failed silently inside the span processor. The exporter
# now runs on the policed `ureq` agent through `opentelemetry-http`'s
# `HttpClient` trait. Removing this feature is what makes reqwest's absence
# from `Cargo.lock` a byte-readable fact a gate can assert.
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "metrics", "http-proto"] }
opentelemetry-http = "0.27"
async-trait = "0.1"
opentelemetry-prometheus = "0.27"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.28"

[profile.release]
lto = "thin"
strip = true
